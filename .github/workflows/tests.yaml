name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A weekly rebuild takes in the base image's security fixes on quiet weeks too.
  schedule:
    - cron: "17 4 * * 1"

# Every job reads the repository and nothing else, unless it says otherwise below. Third-party
# actions are pinned by commit, because a tag can be moved to other code; Dependabot proposes
# the new commit with the version beside it.
permissions:
  contents: read

jobs:
  # The checks that need no database, beside the suite rather than in front of it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pipx install poetry==2.4.1

      - run: poetry install

      # Every locked dependency checked against the published advisories, so a known hole in
      # one fails the build instead of shipping in the image.
      - name: No locked dependency has a known vulnerability
        run: |
          poetry run python -m pip freeze --exclude-editable > requirements.txt
          pipx run pip-audit==2.10.1 --strict --no-deps --disable-pip -r requirements.txt

      # Unused imports, undefined names, likely bugs and import order; pyproject sets the rules.
      - run: poetry run ruff check src tests scripts

      # The page's script is checked for what only a browser visiting the one view would
      # otherwise find: a syntax error, or a name that is defined nowhere (IMP-17).
      - name: The page's script parses and uses no undefined name
        run: |
          mkdir -p "$RUNNER_TEMP/page-lint"
          python3 -c "
          import re, sys
          page = open('src/aistack/bundled/dashboard.html', encoding='utf-8').read()
          for i, script in enumerate(re.findall(r'<script>(.*?)</script>', page, re.S)):
              open(f'{sys.argv[1]}/page{i}.js', 'w', encoding='utf-8').write(script)
          " "$RUNNER_TEMP/page-lint"
          cd "$RUNNER_TEMP/page-lint"
          cat > eslint.config.mjs <<'CONFIG'
          import globals from "globals";
          export default [{ files: ["*.js"], languageOptions: { ecmaVersion: "latest",
            sourceType: "script", globals: globals.browser }, rules: { "no-undef": "error" } }];
          CONFIG
          npm install --no-save --silent eslint@9.39.1 globals@16.5.0
          npx eslint page*.js

  # The suite, browser tests apart, in four shards side by side: about twelve minutes in one
  # job, so the pull request waits for the slowest quarter instead. Each shard runs every
  # fourth test (--shard in tests/conftest.py), so a new test file needs no listing here.
  suite:
    name: suite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Without a bound, a hung test holds the runner for GitHub's six hours and the pull
    # request reads "pending" instead of failed; faulthandler_timeout below names a hung test
    # well before this.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]

    services:
      # The concurrent-admin race (ADR-0008) cannot be reproduced on SQLite, and the test that
      # covers it skips when TEST_DATABASE_URL is unset. CI supplies it, so that skip is a
      # local convenience and never a hole in the build.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aistack
          POSTGRES_PASSWORD: aistack
          POSTGRES_DB: aistack_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aistack -d aistack_test"
          --health-interval 2s --health-timeout 3s --health-retries 15

    env:
      # Never DATABASE_URL: a test that reads the server's own variable could drop the tables
      # of whatever it happens to point at.
      TEST_DATABASE_URL: postgresql+psycopg://aistack:aistack@localhost:5433/aistack_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pipx install poetry==2.4.1

      - run: poetry install

      # Fail setup rather than the assertions: a suite that skipped its only real concurrency
      # test still reports green, and "0 skipped" is the only way to notice from the summary.
      # Connecting is the whole check. Testing that TEST_DATABASE_URL is non-empty would not
      # be one, since the job env above sets it unconditionally.
      - name: Require the PostgreSQL-backed tests to actually run
        run: |
          poetry run python -c "
          import os, psycopg
          psycopg.connect(os.environ['TEST_DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://')).close()
          print('PostgreSQL reachable.')
          "

      # A test still running after two minutes prints every thread's stack and carries on, so
      # a hang that meets the job timeout has already named itself in the log.
      # The browser tests run in the browsers job, beside this one.
      - run: poetry run pytest -q -p no:cacheprovider --no-header -rs -o faulthandler_timeout=120 --ignore=tests/ui --shard ${{ matrix.shard }}

  # The check `main` requires by name. A job whose needs failed is skipped, and a skipped
  # required check counts as passed, so this one always runs and fails unless every shard
  # and the lint job succeeded.
  pytest:
    if: always()
    needs: [lint, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$RESULTS" = "success success"
        env:
          RESULTS: ${{ needs.lint.result }} ${{ needs.suite.result }}

  # The dashboard's own tests open the page in a real browser, in all three engines. A job of
  # its own, beside pytest and not inside it, so the pull request waits for the slower of the
  # two and not for their sum. Firefox alone takes about nine minutes, so each engine runs in
  # two halves. Locally they skip when the browser is missing; here it is installed, so a skip
  # cannot hide them.
  browser-tests:
    name: browser tests (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: ["1/2", "2/2"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pipx install poetry==2.4.1

      - run: poetry install

      - run: poetry run playwright install --with-deps ${{ matrix.browser }}

      # A missing browser skips these tests, which is right on a laptop and would be a green
      # job that tested nothing here. "17 passed" is not asserted, only that nothing skipped.
      - name: Run the dashboard's tests in ${{ matrix.browser }}
        env:
          AISTACK_UI_BROWSER: ${{ matrix.browser }}
        # Named, because only then does the step run with pipefail: without it tee's exit
        # status would stand in for pytest's and a failing test would pass.
        shell: bash
        run: |
          poetry run pytest tests/ui -q -p no:cacheprovider --no-header -rs -o faulthandler_timeout=120 --shard ${{ matrix.shard }} | tee result.txt
          ! grep -q "skipped" result.txt

  # The checks `main` requires by name, `browsers (chromium)`, `browsers (firefox)` and
  # `browsers (webkit)`, one per engine as before the halves. Always run, for the reason given
  # at `pytest`.
  browsers:
    if: always()
    needs: [browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - run: test "$RESULT" = "success"
        env:
          RESULT: ${{ needs.browser-tests.result }}

  # Local mode runs on the person's own computer, and people use Windows. The server runs in
  # a Linux container, so only what runs on their computer is tested here: local mode, the
  # localhost dashboard's routes, a Library shared through git, and the services underneath,
  # on SQLite.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pipx install poetry==2.4.1

      - run: poetry install

      - run: poetry run pytest tests/bundled/test_sync_listing.py tests/mcp/test_local_mode.py tests/mcp/test_library_log.py tests/mcp/test_library_github.py tests/api/test_local_dashboard.py tests/services tests/bootstrap tests/db -q -p no:cacheprovider --no-header -rs

  # Local mode has paths only macOS takes: the hardware id from system_profiler, and gh and uv
  # under /opt/homebrew. The same tests as on Windows (IMP-01).
  macos:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pipx install poetry==2.4.1

      - run: poetry install

      - run: poetry run pytest tests/bundled/test_sync_listing.py tests/mcp/test_local_mode.py tests/mcp/test_library_log.py tests/mcp/test_library_github.py tests/api/test_local_dashboard.py tests/services tests/bootstrap tests/db -q -p no:cacheprovider --no-header -rs

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aistack
          POSTGRES_PASSWORD: aistack
          POSTGRES_DB: aistack_container
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U aistack -d aistack_container"
          --health-interval 2s --health-timeout 3s --health-retries 15

    env:
      # A throwaway secret for a throwaway container. Long enough to pass the startup check.
      INVITE_CODE: ci-container-invite-code-not-a-secret
      METRICS_TOKEN: ci-container-metrics-token-not-a-secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pipx install poetry==2.4.1

      # The smoke script is a client: it needs fastmcp and the archive writer, not a server.
      - run: poetry install

      - run: docker build -t aistack:ci .

      # Known vulnerabilities in the image's packages, reported and not yet failing the job:
      # it fails once there is an allowlist of findings that do not apply (STD-07).
      - name: Scan the image (report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 \
            image --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed aistack:ci

      - name: Start on a fresh volume (SQLite)
        run: |
          # The flags OPERATING.md documents, so an image that needs a writable root or a
          # capability fails here.
          docker run -d --name aistack -p 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e AISTACK_INVITE_CODE="$INVITE_CODE" -e AISTACK_METRICS_TOKEN="$METRICS_TOKEN" \
            -v aistack-ci:/data aistack:ci
          scripts/wait_until_healthy.sh aistack

      - run: poetry run python scripts/container_smoke.py fresh http://127.0.0.1:8000 "$INVITE_CODE" state.json

      - name: The operator's bearer reads the counts, and nobody else's does
        run: |
          curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" http://127.0.0.1:8000/metrics \
            | grep -F 'aistack_tool_calls_total{tool="join",outcome="ok"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/metrics)" = 404

      - name: Restart, and find everything still there
        run: |
          docker restart aistack
          scripts/wait_until_healthy.sh aistack
          poetry run python scripts/container_smoke.py restarted http://127.0.0.1:8000 "$INVITE_CODE" state.json

      - name: The container runs unprivileged
        run: test "$(docker exec aistack id -u)" = "10001"

      # The secrets rule, checked on what the container actually wrote: not the invite code,
      # not a machine token, not a team's invite code, not a transfer ticket.
      - name: No secret reached the logs
        run: |
          docker logs aistack > container.log 2>&1
          cat container.log
          ! grep -F "$INVITE_CODE" container.log
          ! grep -F "$METRICS_TOKEN" container.log
          ! grep -E "aist_[A-Za-z0-9_-]{20,}" container.log
          ! grep -E "aistinv_[A-Za-z0-9_-]{20,}" container.log
          ! grep -E "eyJ[A-Za-z0-9_-]{10,}\." container.log
          grep -F "Invite code: 'configured'" container.log

      # A backup taken while it runs restores, and a stopped server leaves one file.
      - name: Back up, change, stop, restore
        run: |
          docker exec aistack aistack backup /data/before.db
          poetry run python scripts/container_smoke.py changed http://127.0.0.1:8000 "$INVITE_CODE" state.json
          docker stop aistack
          docker run --rm -v aistack-ci:/data aistack:ci \
            sh -c 'test -s /data/aistack.db && test ! -e /data/aistack.db-wal'
          docker run --rm -v aistack-ci:/data aistack:ci aistack restore /data/before.db
          docker start aistack
          scripts/wait_until_healthy.sh aistack
          poetry run python scripts/container_smoke.py restored http://127.0.0.1:8000 "$INVITE_CODE" state.json

      - name: The same image runs against PostgreSQL
        run: |
          docker rm -f aistack
          docker run -d --name aistack-postgres --network host \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e AISTACK_INVITE_CODE="$INVITE_CODE" \
            -e AISTACK_PORT=8001 \
            -e DATABASE_URL=postgresql+psycopg://aistack:aistack@127.0.0.1:5434/aistack_container \
            aistack:ci
          scripts/wait_until_healthy.sh aistack-postgres
          poetry run python scripts/container_smoke.py fresh http://127.0.0.1:8001 "$INVITE_CODE" state-postgres.json

      # The package `uvx aistack-mcp` installs, driven the same way. Built from this commit and
      # installed with pip into an environment of its own, resolving dependencies as a user's
      # computer would, so a file left out of the wheel fails here and not after a release.
      - name: The PyPI package runs
        run: |
          poetry build
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install --quiet dist/*.whl
          AISTACK_INVITE_CODE="$INVITE_CODE" AISTACK_PORT=8002 \
            DATABASE_URL="sqlite:///$RUNNER_TEMP/wheel.db" \
            "$RUNNER_TEMP/wheel/bin/aistack-mcp" serve > wheel.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8002/health && break; sleep 1; done
          poetry run python scripts/container_smoke.py fresh http://127.0.0.1:8002 "$INVITE_CODE" state-wheel.json

      # The sentence a newcomer pastes (RUN_COMMAND in aistack.bundled), run as they run it:
      # from PyPI, on a home folder with nothing in it. A yanked or renamed release fails here.
      - name: Setup runs from PyPI
        run: |
          pipx install uv==0.11.32
          HOME="$(mktemp -d)" uvx --no-cache aistack-mcp setup > setup.txt
          head -n 1 setup.txt | grep -Fx "# Set up AIStack on this computer"

      # Every setup sentence runs whatever PyPI serves as `aistack-mcp`, so it must still be
      # this project's.
      - name: aistack-mcp on PyPI is this project
        run: |
          curl -sf -o pypi.json https://pypi.org/pypi/aistack-mcp/json
          python3 -c "import json; home = json.load(open('pypi.json'))['info']['project_urls']['Homepage']; assert home == 'https://github.com/$GITHUB_REPOSITORY', home"

      - name: Container logs, if anything failed
        if: failure()
        run: docker logs aistack 2>&1 || true; docker logs aistack-postgres 2>&1 || true; cat wheel.log 2>/dev/null || true

  # The real service checks our local Git stand-in weekly, outside the merge gate.
  github-contract:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AISTACK_E2E_GITHUB_REPO: ${{ vars.AISTACK_E2E_GITHUB_REPO }}
    steps:
      - name: Check whether the GitHub test repository is configured
        id: configuration
        env:
          TEST_TOKEN: ${{ secrets.AISTACK_E2E_GITHUB_TOKEN }}
        run: |
          if [ -z "$AISTACK_E2E_GITHUB_REPO" ] || [ -z "$TEST_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the real-GitHub contract test. Configure AISTACK_E2E_GITHUB_REPO and AISTACK_E2E_GITHUB_TOKEN to enable it." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configuration.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.configuration.outputs.configured == 'true'
        with:
          python-version: "3.13"

      - run: pipx install poetry==2.4.1
        if: steps.configuration.outputs.configured == 'true'

      - run: poetry install
        if: steps.configuration.outputs.configured == 'true'

      - name: A skill travels between computers through real GitHub
        if: steps.configuration.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.AISTACK_E2E_GITHUB_TOKEN }}
        run: poetry run pytest tests/e2e/test_real_github.py -q -rs

  # The image people run, published only from a commit every job above passed on: a push to
  # main, or a version tag. A pull request never publishes, whatever its branch holds.
  publish:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: [lint, suite, pytest, browser-tests, browsers, windows, macos, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Signs the image with this workflow's identity (keyless Sigstore), nothing else.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 as well, for ARM servers and a Raspberry Pi. It is built under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A vX.Y.Z tag publishes X.Y.Z, X.Y (the channel the docs name, which only moves to a
      # release that works beside the one before it) and latest, the newest release. main
      # publishes edge and sha-<commit>, for trying what is coming: never latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/aistack
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A build of main names its commit (0.1.0+g1a2b3c4); a release's names its version.
          build-args: |
            AISTACK_BUILD_COMMIT=${{ !startsWith(github.ref, 'refs/tags/v') && github.sha || '' }}
          # What the image holds and how it was built, attached to it for whoever checks.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # An operator can check that an image came from this workflow:
      # cosign verify ghcr.io/dchristopoulos/aistack:<tag> \
      #   --certificate-identity-regexp '.*/tests.yaml@.*' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/aistack@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  # The package behind `uvx aistack-mcp`, published only from a version tag every job above
  # passed on. PyPI trusts this job by its OIDC identity (trusted publishing), so no upload
  # token exists to leak. To release: set `version` in pyproject.toml and write its section in
  # CHANGELOG.md, merge that, then tag the commit `v<version>` and push the tag. The image gets the same version from the same tag.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, suite, pytest, browser-tests, browsers, windows, macos, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Named on pypi.org's trusted publisher, so only this job, in this environment, can upload.
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous release's tag, to see what changed since.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pipx install poetry==2.4.1

      # PyPI never accepts a version twice, so a tag that disagrees with the package would
      # publish a release that cannot be corrected under its own number.
      - name: The tag names the package's version
        run: test "$GITHUB_REF_NAME" = "v$(poetry version -s)"

      # CHANGELOG.md has its notes, and a migration older releases cannot run beside comes
      # with a new minor, so the X.Y image tag never moves onto it.
      - name: The release may be published
        run: python scripts/check_release.py check "$(poetry version -s)"

      - run: poetry build

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      # A release is done when a computer with nothing on it can run the sentence setup hands
      # out. PyPI takes a minute or two to serve a new upload, so this asks for up to five.
      - name: A clean computer runs setup from PyPI
        run: |
          pipx install uv==0.11.32
          version="$(poetry version -s)"
          for _ in $(seq 1 30); do
            HOME="$(mktemp -d)" uvx --no-cache "aistack-mcp@$version" setup > setup.txt 2> uvx.log && break
            sleep 10
          done
          cat uvx.log
          head -n 1 setup.txt | grep -Fx "# Set up AIStack on this computer"

  # The GitHub Release, with the version's section of CHANGELOG.md as its notes. Its own job,
  # so the token that can write to the repository is never in the job that uploads to PyPI.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/check_release.py notes "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "AIStack $version" \
            --notes-file notes.md
