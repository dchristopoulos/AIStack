name: Windows crash recovery
on:
  push:
    branches: [test/windows-crash-recovery]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: pipx install poetry==2.4.1
      - run: poetry install
      - run: poetry run pytest tests/services/test_crash_recovery.py -q -s --tb=short
