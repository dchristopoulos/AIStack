[project]
# "aistack" on PyPI belongs to an unrelated project, and PyPI refuses look-alikes of it.
# The import package and the command are still `aistack`.
name = "aistack-mcp"
version = "0.1.2"
description = "A self-hosted home for your AI coding skills, shared with your team over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "dchristopoulos",email = "dimitrisgr56@gmail.com"}
]
# Upper bound is not taste: a transitive dependency (openapi-pydantic, via fastmcp) caps
# itself at <4.0, and Poetry cannot resolve an open-ended floor against it.
requires-python = ">=3.13,<4.0"
# PEP 508 ranges, not Poetry carets: [project].dependencies is standard metadata.
# fastmcp alone is pinned exactly: ticket #1's spike results are statements about
# one release, and a silent minor bump would invalidate them.
dependencies = [
    "fastmcp==3.4.7",
    "SQLAlchemy>=2.1.5,<3.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    # Both arrive through fastmcp today. They are declared because AIStack imports them
    # directly: frontmatter parsing and transfer tickets must not vanish with a transitive.
    "PyYAML>=6.0.3,<7.0.0",
    "PyJWT>=2.15.1,<3.0.0",
    "alembic>=1.16,<2.0",
]

[project.urls]
Homepage = "https://github.com/dchristopoulos/AIStack"

# Both names start the same program: `uvx aistack-mcp` runs the command named after the
# package, and once it is installed people type `aistack`.
[project.scripts]
aistack = "aistack.bootstrap.__main__:run"
aistack-mcp = "aistack.bootstrap.__main__:run"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "hypothesis>=6.117,<7.0",
    # The suite's own pytest plugin, for the async HTTP tests. It arrives transitively through
    # fastmcp, but an undeclared plugin means fastmcp moving off anyio silently stops those
    # tests being collected rather than failing.
    "anyio>=4.15.1,<5.0.0",
    # Drives the dashboard page in a real browser (tests/ui).
    "playwright>=1.50,<2.0",
    # axe-core, which the browser tests run on every screen of the page.
    "axe-playwright-python>=0.1.8,<0.2.0",
    # Unused imports, undefined names, likely bugs and import order (IMP-17); CI runs it.
    "ruff>=0.14.0,<0.15.0",
]

[tool.poetry]
packages = [{include = "aistack", from = "src"}]

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E9", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["aistack", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
