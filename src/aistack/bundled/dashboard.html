        groups: [
          { path: 'developers', private: false, member: true, subscribed: true, sees_skills: true },
          { path: 'developers/backend', private: false, member: true, subscribed: true, sees_skills: true },
          { path: 'developers/frontend', private: false, member: false, subscribed: true, sees_skills: true },
          { path: 'security', private: true, member: true, subscribed: true, sees_skills: true },
        ],
        skills: [
          { name: 'commit-messages', description: 'Writes commit messages in the house style: imperative subject, why before what.', group: null, revision: 2, pushed_by: 'dimitris', updated_on: ago(96), in_library: true },
          { name: 'release-notes', description: 'Builds release notes from merged pull requests since the last tag.', group: null, revision: 1, pushed_by: 'dimitris', updated_on: ago(300), in_library: false },
          { name: 'code-review', description: 'Reviews a diff against team standards and flags risky changes.', group: 'developers', revision: 3, pushed_by: 'maria', updated_on: ago(3), in_library: true },
          { name: 'api-design', description: 'Checks a new endpoint against the API guidelines before it ships.', group: 'developers', revision: 5, pushed_by: 'eve', updated_on: ago(120), in_library: false },
          { name: 'sqlalchemy-migrations', description: 'Plans and writes Alembic migrations that run identically on SQLite and Postgres.', group: 'developers/backend', revision: 4, pushed_by: 'maria', updated_on: ago(52), in_library: true },
          { name: 'mcp-tool-authoring', description: 'Scaffolds a thin MCP tool with its service function and rejection tests.', group: 'developers/backend', revision: 2, pushed_by: 'dimitris', updated_on: ago(26), in_library: false },
          { name: 'threat-model', description: 'Walks a design through trust boundaries and lists what an attacker controls.', group: 'security', revision: 1, pushed_by: 'eve', updated_on: ago(240), in_library: false },
          { name: 'dependency-audit', description: 'Audits new dependencies for licence, maintenance and known advisories.', group: 'security', revision: 3, pushed_by: 'eve', updated_on: ago(18), in_library: false },
        ] },
    ],
  };
})();

function fail(message) { throw new Error(message); }
const dNow = () => new Date().toISOString();
const dMe = () => DB.user.username;
const dTeam = name => DB.teams.find(t => t.name === name) || fail(`There is no team called ${name}.`);
const dMine = name => DB.skills.find(s => s.name === name) || fail(`${name} is not in your library.`);
const dTeamSkill = (t, name) => t.skills.find(s => s.name === name) || fail(`${t.name} has no skill called ${name}.`);
const dMember = (t, username) => t.members.find(m => m.username === username) || fail(`${username} is not in ${t.name}.`);
const dProject = (id, key, harness) => {
  const m = DB.machines.find(x => x.id === id) || fail(`You have no computer '${id}'.`);
  const p = m.projects.find(x => x.key === key && (!harness || x.folders.some(f => f.harness === harness)));
  return p || fail(`This computer does not manage a project '${key}'. Sync from inside the repository first, or add it on the dashboard.`);
};
const dGroup = (t, path) => t.groups.find(g => g.path === path) || fail(`${t.name} has no group ${path}.`);
const dAdmin = t => { if (t.role !== 'ADMIN') fail(`Only an admin of ${t.name} can do that.`); };

// The text of each rule, apart from the state as the server keeps it apart.
const DEMO_RULE_TEXT = {
  '\nhouse-style': '# House style\n\n- Write for a reader who skims: the point first, then the detail.\n- Name things in product terms, never internal ones.\n- Run the tests before saying something works.\n',
  'github.com/demo-team/demo-api\npayments': '# Payments\n\n- Refunds go through `payments/refunds.py` only.\n- Ask before changing anything under payments/.\n',
};
const dRule = (name, project) => DB.rules.find(r => r.name === name && r.project === (project || null))
  || fail(`You have no rule named '${name}' ${project ? `for project '${project}'` : 'for every project'}.`);
const dCredentials = text => text.split('\n').flatMap((line, i) => (/\baist_[A-Za-z0-9_-]{20,}|\bgh[pousr]_[A-Za-z0-9]{36,}|\bsk-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----/.test(line) ? [i + 1] : []));
const dSaveRule = (r, b) => {
  const lines = dCredentials(b.text);
  if (lines.length && !b.confirmed) return { name: r.name, saved: false, credential_lines: lines, revision: null, unchanged: false };
  const key = (r.project || '') + '\n' + r.name, unchanged = DEMO_RULE_TEXT[key] === b.text;
  if (!unchanged) Object.assign(r, { revision: r.revision + 1, pushed_by: dMe(), updated_on: dNow() });
  DEMO_RULE_TEXT[key] = b.text;
  return { name: r.name, saved: true, credential_lines: lines, revision: r.revision, unchanged };
};
const dRuleAgents = (r, agents) => {
  const other = !r.project && DB.rules.find(x => x !== r && !x.project && x.agents.some(a => agents.includes(a)));
  if (other) fail(`Your rule '${other.name}' is already the file for every project of one of these agents. Take that agent off '${other.name}' first, or make this a rule for a project.`);
  r.agents = ['claude_code', 'codex'].filter(a => agents.includes(a));
};

const DEMO_ROUTES = [
  [/^\/api\/rules$/, b => {
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(b.name || '')) fail(`A rule name is lowercase letters and digits in groups joined by single hyphens, like 'house-style'. Received: '${b.name}'.`);
    if (DB.rules.some(r => r.name === b.name && r.project === (b.project || null))) fail(`You already have a rule named '${b.name}' there. Edit it, or pick another name.`);
    const r = { name: b.name, project: b.project || null, agents: [], revision: 0, pushed_by: dMe(), updated_on: dNow() };
    const said = dSaveRule(r, b);
    if (!said.saved) return said;
    dRuleAgents(r, b.agents || []);
    DB.rules.push(r);
    DB.rules.sort((a, c) => ((a.project || '') + '\n' + a.name).localeCompare((c.project || '') + '\n' + c.name));
    return said;
  }],
  [/^\/api\/rules\/([^/]+)\/edit$/, (b, name) => dSaveRule(dRule(name, b.project), b)],
  [/^\/api\/rules\/([^/]+)\/agents$/, (b, name) => { const r = dRule(name, b.project); dRuleAgents(r, b.agents || []); return { agents: r.agents }; }],
  [/^\/api\/rules\/([^/]+)\/remove$/, (b, name) => { const r = dRule(name, b.project); DB.rules = DB.rules.filter(x => x !== r); return { name }; }],
  [/^\/api\/rules\/([^/?]+)\/text(?:\?project=(.+))?$/, (b, name, project) => {
    const r = dRule(name, project), text = DEMO_RULE_TEXT[(r.project || '') + '\n' + r.name] || '';
    return { name, project: r.project, revision: r.revision, text, credential_lines: dCredentials(text) };
  }],
  [/^\/api\/skills\/([^/]+)\/machines\/([^/]+)$/, (b, name, id) => {
    const s = dMine(name);
    const harness = b.harness || 'claude_code', project = b.project || null;
    if (project) dProject(id, project, harness);
    s.placements = s.placements.filter(p => p.machine !== id || p.harness !== harness || (p.project || null) !== project);
    if (b.enabled) s.placements.push({ machine: id, harness, project });
  }],
  [/^\/api\/machines\/([^/]+)\/projects$/, (b, id) => {
    const m = DB.machines.find(x => x.id === id) || fail(`You have no computer '${id}'.`);
    const known = DB.machines.flatMap(x => x.projects).find(p => p.key === b.project) || fail(`You have no project '${b.project}'.`);
    const harness = b.harness || 'claude_code';
    let mine = m.projects.find(p => p.key === known.key);
    if (!mine) m.projects.push(mine = { key: known.key, name: known.name, folders: [] });
    if (!mine.folders.some(f => f.harness === harness)) mine.folders.push({ harness, path: null, last_synced_on: null });
  }],
  [/^\/api\/machines\/([^/]+)\/projects\/remove$/, (b, id) => {
    const project = dProject(id, b.project, b.harness);
    const removed = project.folders.filter(f => !b.harness || f.harness === b.harness);
    project.folders = project.folders.filter(f => !removed.includes(f));
    const m = DB.machines.find(x => x.id === id);
    m.projects = m.projects.filter(p => p.folders.length);
    DB.skills.forEach(s => { s.placements = s.placements.filter(p => p.machine !== id || p.project !== b.project || (b.harness && p.harness !== b.harness)); });
    return { removed: removed.length };
  }],
  [/^\/api\/skills\/([^/]+)\/share$/, (b, name) => {
    const s = dMine(name), t = dTeam(b.team), group = b.group || null;
    const had = t.skills.find(x => x.name === name);
    const fromHere = !!s.source && s.source.team === t.name;
    if (had && fromHere && s.source.revision === had.revision && (had.group || null) === group) {
      return { team: t.name, group, revision: had.revision, created: false, unchanged: true, previous_pushed_by: had.pushed_by, possibly_unrelated: false, overwrote_revision: null, updates_from: null };
    }
    const revision = had ? had.revision + 1 : 1, previous = had ? had.pushed_by : null;
    const copy = { name, description: s.description, group, revision, pushed_by: dMe(), updated_on: dNow(), in_library: true };
    if (had) Object.assign(had, copy); else t.skills.push(copy);
    const overwrote = had && fromHere && s.source.revision < had.revision ? had.revision : null;
    const follows = s.source && !fromHere ? s.source.team : null;
    if (!follows) s.source = { team: t.name, group, revision, latest_revision: revision, latest_pushed_by: dMe(), update_available: false, own_changes: false };
    return { team: t.name, group, revision, created: !had, unchanged: false, previous_pushed_by: previous, possibly_unrelated: !!had && !fromHere && !follows,
      overwrote_revision: overwrote, updates_from: follows };
  }],
  [/^\/api\/skills\/([^/]+)\/remove$/, (b, name) => {
    dMine(name);
    DB.skills = DB.skills.filter(s => s.name !== name);
    DB.teams.forEach(t => t.skills.forEach(s => { if (s.name === name) s.in_library = false; }));
  }],
  [/^\/api\/teams$/, b => {
    if (!NAME_RE.test(b.name)) fail(`"${b.name}" is not a valid team name. ${NAME_RULE}`);
    if (DB.teams.some(t => t.name === b.name)) fail(`A team called ${b.name} already exists. Pick another name.`);
    DB.teams.push({ name: b.name, kind: 'SHARED', role: 'ADMIN', sees_all_groups: false, members: [{ username: dMe(), role: 'ADMIN', sees_all_groups: false, groups: [] }], groups: [], skills: [] });
  }],
  [/^\/api\/teams\/join$/, b => {
    if (!/^aistinv_.+/.test(b.code)) fail('That invite code is not valid. Ask an admin of the team for a new one. (In the demo, any code starting with aistinv_ works.)');
    if (DB.teams.some(t => t.name === 'design')) fail('You are already in design.');
    DB.teams.push({ name: 'design', kind: 'SHARED', role: 'MEMBER', sees_all_groups: false,
      members: [{ username: 'eve', role: 'ADMIN', sees_all_groups: false, groups: ['tokens'] }, { username: dMe(), role: 'MEMBER', sees_all_groups: false, groups: [] }],
      groups: [{ path: 'tokens', private: false, member: false, subscribed: true, sees_skills: true }],
      skills: [{ name: 'design-tokens', description: 'Keeps colours, spacing and type in sync with the token file.', group: 'tokens', revision: 2, pushed_by: 'eve', updated_on: dNow(), in_library: false }] });
    return { team: 'design' };
  }],
  [/^\/api\/teams\/([^/]+)\/leave$/, (b, team) => {
    const t = dTeam(team);
    if (t.role === 'ADMIN' && t.members.filter(m => m.role === 'ADMIN').length === 1 && t.members.length > 1) fail(`You are the only admin of ${t.name}. Make someone else an admin before you leave.`);
    DB.teams = DB.teams.filter(x => x !== t);
    DB.skills.forEach(s => { if (s.source && s.source.team === team) s.source = null; });
  }],
  [/^\/api\/teams\/([^/]+)\/delete$/, (b, team) => {
    const t = dTeam(team);
    if (t.role !== 'ADMIN') fail(`Only an admin of ${t.name} can do that. Ask one of its admins.`);
    DB.teams = DB.teams.filter(x => x !== t);
    DB.skills.forEach(s => { if (s.source && s.source.team === team) s.source = null; });
  }],
  [/^\/api\/teams\/([^/]+)\/invite$/, (b, team) => {
    const t = dTeam(team);
    if (t.role !== 'ADMIN' && !t.can_invite) fail(`Only an admin of ${t.name}, or a member an admin lets invite, can do that.`);
    const bytes = crypto.getRandomValues(new Uint8Array(18));
    const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2, '0')).join('');
    (t.invites = t.invites || []).unshift({ id, created_by: dMe(), created_on: dNow(), expires_on: new Date(Date.now() + 7 * 86400e3).toISOString(), status: 'PENDING', used_by: null });
    return { code: 'aistinv_' + Array.from(bytes, x => x.toString(36).padStart(2, '0')).join('').slice(0, 32), id };
  }],
  [/^\/api\/teams\/([^/]+)\/invites\/([^/]+)\/cancel$/, (b, team, id) => {
    const i = (dTeam(team).invites || []).find(x => x.id === id) || fail('That invite is not there.');
    i.status = 'CANCELLED';
  }],
  [/^\/api\/teams\/([^/]+)\/take$/, (b, team) => {
    const t = dTeam(team), ts = dTeamSkill(t, b.name);
    const source = { team: t.name, group: ts.group, revision: ts.revision, latest_revision: ts.revision, latest_pushed_by: ts.pushed_by, update_available: false, own_changes: false };
    const mine = DB.skills.find(s => s.name === b.name);
    if (mine && !b.replace && !(mine.source && mine.source.team === t.name)) {
      fail(`You already have your own ${b.name} (revision ${mine.revision}, last pushed by ${mine.pushed_by}) that was not taken from team ${t.name}.`);
    }
    if (mine) Object.assign(mine, { description: ts.description, revision: mine.revision + 1, pushed_by: ts.pushed_by, updated_on: dNow(), source });
    else DB.skills.push({ name: ts.name, description: ts.description, revision: 1, pushed_by: ts.pushed_by, updated_on: dNow(), files: 3, placements: [], source });
    DB.skills.sort((a, c) => a.name.localeCompare(c.name));
    ts.in_library = true;
  }],
  [/^\/api\/teams\/([^/]+)\/members\/([^/]+)$/, (b, team, username) => {
    const t = dTeam(team); dAdmin(t);
    const m = dMember(t, username);
    if (b.role && b.role !== m.role) {
      if (b.role === 'MEMBER' && t.members.filter(x => x.role === 'ADMIN').length === 1) fail(`${username} is the only admin of ${t.name}. Make someone else an admin first.`);
      m.role = b.role;
      if (username === dMe()) t.role = b.role;
    }
    if (typeof b.sees_all_groups === 'boolean') {
      m.sees_all_groups = b.sees_all_groups;
      if (username === dMe()) t.sees_all_groups = b.sees_all_groups;
    }
    if (typeof b.can_invite === 'boolean') {
      m.can_invite = b.can_invite;
      if (username === dMe()) t.can_invite = b.can_invite;
    }
  }],
  [/^\/api\/teams\/([^/]+)\/members\/([^/]+)\/remove$/, (b, team, username) => {
    const t = dTeam(team); dAdmin(t);
    dMember(t, username);
    t.members = t.members.filter(m => m.username !== username);
  }],
  [/^\/api\/teams\/([^/]+)\/groups$/, (b, team) => {
    const t = dTeam(team); dAdmin(t);
    if (!NAME_RE.test(b.name)) fail(`"${b.name}" is not a valid group name. ${NAME_RULE}`);
    if (b.parent) dGroup(t, b.parent);
    const path = b.parent ? `${b.parent}/${b.name}` : b.name;
    if (t.groups.some(g => g.path === path)) fail(`${t.name} already has a group ${path}.`);
    t.groups.push({ path, private: !!b.private, member: true, subscribed: true, sees_skills: true });
    dMember(t, dMe()).groups.push(path);
    return { path };
  }],
  [/^\/api\/teams\/([^/]+)\/group$/, (b, team) => {
    const t = dTeam(team), g = dGroup(t, b.path);
    if (typeof b.private === 'boolean') { dAdmin(t); g.private = b.private; }
    if (typeof b.subscribed === 'boolean') g.subscribed = b.subscribed;
  }],
  [/^\/api\/teams\/([^/]+)\/group\/rename$/, (b, team) => {
    const t = dTeam(team); dAdmin(t);
    const g = dGroup(t, b.path);
    if (!NAME_RE.test(b.name)) fail(`"${b.name}" is not a valid group name. ${NAME_RULE}`);
    const cut = g.path.lastIndexOf('/'), path = (cut > 0 ? g.path.slice(0, cut + 1) : '') + b.name;
    if (t.groups.some(x => x.path === path)) fail(`Team '${t.name}' already has a group '${path}'.`);
    const moved = p => p === g.path || p.startsWith(g.path + '/') ? path + p.slice(g.path.length) : p;
    t.groups.forEach(x => { x.path = moved(x.path); });
    t.skills.forEach(s => { if (s.group) s.group = moved(s.group); });
    t.members.forEach(m => { m.groups = (m.groups || []).map(moved).sort(); });
    return { path };
  }],
  [/^\/api\/teams\/([^/]+)\/group\/delete$/, (b, team) => {
    const t = dTeam(team); dAdmin(t);
    const g = dGroup(t, b.path);
    if (t.groups.some(x => x.path.startsWith(g.path + '/'))) fail(`Group '${g.path}' has groups inside it. Delete or rename those first.`);
    if (t.skills.some(s => s.group === g.path)) fail(`Group '${g.path}' still has skills. Move them to another group or remove them from the team first.`);
    t.groups = t.groups.filter(x => x !== g);
    t.members.forEach(m => { m.groups = (m.groups || []).filter(p => p !== g.path); });
  }],
  [/^\/api\/teams\/([^/]+)\/group\/members$/, (b, team) => {
    const t = dTeam(team); dAdmin(t);
    const g = dGroup(t, b.path), m = dMember(t, b.username);
    m.groups = m.groups.filter(p => p !== b.path);
    if (b.member) m.groups.push(b.path);
    m.groups.sort();
    if (b.username === dMe()) g.member = !!b.member;
  }],
  [/^\/api\/teams\/([^/]+)\/skills\/([^/]+)\/move$/, (b, team, name) => {
    const t = dTeam(team); dAdmin(t);
    const s = dTeamSkill(t, name);
    if (b.group) dGroup(t, b.group);
    s.group = b.group || null;
    DB.skills.forEach(x => { if (x.name === name && x.source && x.source.team === team) x.source.group = s.group; });
  }],
  [/^\/api\/teams\/([^/]+)\/skills\/([^/]+)\/remove$/, (b, team, name) => {
    const t = dTeam(team); dAdmin(t);
    dTeamSkill(t, name);
    t.skills = t.skills.filter(s => s.name !== name);
    DB.skills.forEach(x => { if (x.name === name && x.source && x.source.team === team) x.source = null; });
  }],
  [/^\/api\/machines\/([^/]+)\/remove$/, (b, id) => {
    const m = DB.machines.find(x => x.id === id) || fail(`You have no computer '${id}'.`);
    if (DB.machines.length === 1) fail(`'${m.name}' is your only computer, so it cannot be removed: you would have no way back in. Add the computer you use instead first, then remove this one.`);
    DB.machines = DB.machines.filter(x => x !== m);
    DB.machines.forEach(x => { if (x.added_by === m.name) { x.added_by = null; x.added_by_removed = true; } });
    DB.skills.forEach(s => { s.placements = s.placements.filter(p => p.machine !== id); });
    return { removed: m.name };
  }],
  [/^\/api\/machines\/([^/]+)\/rename$/, (b, id) => {
    const m = DB.machines.find(x => x.id === id) || fail(`You have no computer '${id}'.`);
    const name = (b.name || '').trim();
    if (!name) fail('name is blank. Give a name with at least one non-whitespace character.');
    if (DB.machines.some(x => x !== m && x.name === name)) fail(`You already have a computer named '${name}'. Pick another name.`);
    DB.machines.forEach(x => { if (x.added_by === m.name) x.added_by = name; });
    m.name = name;
    return { name };
  }],
  [/^\/api\/skills\/([^/]+)\/history$/, (b, name) => {
    const s = dMine(name);
    return { revisions: Array.from({ length: s.revision }, (_, i) => ({ revision: s.revision - i, pushed_by: s.pushed_by, pushed_on: s.updated_on, files: s.files })) };
  }],
  [/^\/api\/skills\/([^/]+)\/restore$/, (b, name) => {
    const s = dMine(name);
    Object.assign(s, { revision: s.revision + 1, pushed_by: dMe(), updated_on: dNow() });
    return { revision: s.revision, unchanged: false };
  }],
  [/^\/api\/teams\/([^/]+)\/skills\/([^/]+)\/changes$/, (b, team, name) => {
    const s = dMine(name), to = s.source.latest_revision;
    return { from_revision: s.revision, to_revision: to, pushed_by: s.source.latest_pushed_by, truncated: false, files: [{ path: 'SKILL.md', change: 'changed',
      diff: `--- yours r${s.revision}/SKILL.md\n+++ ${team} r${to}/SKILL.md\n@@ -4,1 +4,2 @@\n Read the change before the summary.\n+Also check that migrations are reviewed.\n` }] };
  }],
  [/^\/api\/logout$/, () => {}],
];

async function demoApi(path, body) {
  await new Promise(r => setTimeout(r, 220));
  if (path === '/api/state') return JSON.parse(JSON.stringify(DB));
  for (const [re, handler] of DEMO_ROUTES) {
    const m = re.exec(path);
    if (m) return handler(body || {}, ...m.slice(1).map(x => x && decodeURIComponent(x))) || {};
  }
  fail(`The demo does not know ${path}.`);
}

/* ================= start ================= */

function start() {
  const code = takeJoinCode();
  load().then(() => offerJoin(code)).catch(e => {
    if (e instanceof SessionEnded) return sessionEnded();
    $main.replaceChildren(el('div', { class: 'wrap body' }, empty('info', W.loadFailed, el('p', null, e.message),
      btn(W.tryAgain, { class: 'btn primary', on: { click: ev => { ev.currentTarget.setAttribute('aria-disabled', 'true'); start(); } } }))));
  });
}
start();
})();
