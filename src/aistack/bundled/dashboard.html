    lines: [
      'It is removed from your library and from all your computers.',
      `Each computer${names ? ` (${names})` : ''} will be asked at its next sync whether to delete the skill's folder.`,
      s.source && `The copy in ${teamLabel(s.source.team, s.source.group)} is not affected.`,
    ],
    onSubmit: async () => {
      await api(`/api/skills/${enc(s.name)}/remove`, {});
      return `Removed ${s.name} from your library. Each computer asks about its folder at its next sync.`;
    },
  });
}

/* ---------- team ---------- */

function teamView(team, tab, group) {
  const admin = team.role === 'ADMIN';
  const tabs = [['skills', 'Skills', team.skills.length], ['members', 'Members', members(team).length], ['groups', 'Groups', team.groups.length], ['settings', 'Settings', null]];
  if (!tabs.some(t => t[0] === tab)) tab = 'skills';
  const panels = { skills: skillsTab, members: membersTab, groups: groupsTab, settings: settingsTab };
  const tablist = el('div', { class: 'tabs', role: 'tablist', 'aria-label': team.name },
    tabs.map(([id, label, count]) => el('button', {
      type: 'button', class: 'tab', role: 'tab', id: 'tab-' + id, fk: 'tab:' + id,
      'aria-selected': String(id === tab), 'aria-controls': 'tabpanel', tabIndex: id === tab ? 0 : -1,
      on: { click: () => go(teamHash(team.name, id)) },
    }, label, count != null && el('span', { class: 'count' }, String(count)))));
  tablist.addEventListener('keydown', ev => {
    const step = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : 0;
    if (!step) return;
    ev.preventDefault();
    const i = tabs.findIndex(t => t[0] === tab);
    const next = tabs[(i + step + tabs.length) % tabs.length][0];
    tablist.querySelector('#tab-' + tab).dataset.fk = ''; // focus follows the newly selected tab
    go(teamHash(team.name, next));
    setTimeout(() => { const t = byFk('tab:' + next); if (t) t.focus(); });
  });
  return [
    el('div', { class: 'band has-tabs' },
      el('div', { class: 'wrap' },
        el('div', { class: 'team-head' },
          el('span', { class: 'avatar lg' }, team.name[0]),
          el('div', { class: 'titles' },
            el('div', { class: 'line' },
              el('h1', null, team.name),
              el('span', { class: 'badge' + (admin ? ' solid' : '') }, admin ? 'Admin' : 'Member')),
            el('p', { class: 'subtitle' }, plural(members(team).length, 'member'), ', ', plural(team.skills.length, 'skill'), ', ', plural(team.groups.length, 'group')))),
        tablist)),
    el('div', { class: 'wrap body', id: 'tabpanel', role: 'tabpanel', 'aria-labelledby': 'tab-' + tab }, panels[tab](team, admin, group)),
  ];
}

function subscribeSwitch(team, g) {
  const via = unsubscribedVia(team, g.path);
  const on = g.subscribed && !via;
  return sw(on, on ? 'Subscribed' : 'Unsubscribed', {
    fk: `sub:${team.name}:${g.path}`,
    label: `Subscribed to ${g.path}`,
    disabled: via ? true : null,
    tip: via ? `Unsubscribed through ${via}. Subscribe to ${via} to be offered updates here again.`
      : on ? 'You are offered updates from this group and the groups under it.'
      : 'You are not offered updates from this group or the groups under it. Nothing is hidden.',
    onToggle: (b, next) => run(b, async () => {
      await api(`/api/teams/${enc(team.name)}/group`, { path: g.path, subscribed: next });
      return next
        ? `Subscribed to ${g.path}. You will be offered its updates again.`
        : `Unsubscribed from ${g.path} and the groups under it. You will not be offered their updates; nothing is hidden.`;
    }),
  });
}

const privateBadge = () => el('span', { class: 'badge private' }, icon('lock', 11), 'Private');
const hintRow = (depth, text) => el('div', { class: 'tr hint-row', role: 'row', style: `--d:${depth}` }, el('div', { role: 'cell' }, text));

// One header row of the skills tree: a chevron that folds everything under it.
function foldRow(key, depth, { title, ic, label, plain, badge, count, side }) {
  const open = !collapsed.has(key);
  return el('div', { class: 'tr grp', role: 'row', style: `--d:${depth}` },
    el('div', { class: 'grp-cell', role: 'cell' },
      el('button', {
        type: 'button', class: 'group-toggle', fk: 'grp:' + key, 'aria-expanded': String(open), title,
        on: { click: () => { if (open) collapsed.add(key); else collapsed.delete(key); render(); } },
      },
        el('span', { class: 'chev' }, icon('chev', 14)),
        el('span', { class: 'gicon' }, icon(ic, 15)),
        el('span', { class: 'gname' + (plain ? ' plain' : '') }, label),
        badge,
        el('span', { class: 'count' }, plural(count, 'skill'))),
      side));
}

function skillsTab(team, admin, group) {
  const roots = groupTree(team);
  const only = group && flatten(roots).map(n => n.node).find(n => n.path === group);
  if (only) {
    const rows = [];
    groupRows(team, only, admin, 0, rows);
    return [
      el('div', { class: 'panel-head' },
        el('p', { class: 'muted' }, 'The group ', el('span', { class: 'mono' }, group), only.children.length ? ' and the groups under it.' : '.'),
        el('a', { class: 'btn', href: teamHash(team.name) }, `All of ${team.name}`)),
      el('div', { class: 'tbl tree', role: 'table', 'aria-label': `Skills in ${group}` },
        el('div', { class: 'tr th-row', role: 'row' }, th('Skill'), th('Revision'), th('Pushed by'), thActions()),
        rows),
    ];
  }
  if (!team.skills.length && !roots.length) {
    return empty('layers', 'No skills in this team yet',
      el('p', null, 'Share one of your skills to get it started: open your library and choose "Share with a team…". The team gets its own copy.'),
      btn('Open your library', { on: { click: () => go('#/library') } }));
  }
  const top = team.skills.filter(s => !s.group);
  const topKey = team.name + '\n'; // no group path is empty, so this cannot collide with one
  const rows = [foldRow(topKey, 0, { title: 'Skills shared without a group', ic: 'users', label: 'Team level', plain: true, count: top.length })];
  if (!collapsed.has(topKey)) {
    rows.push(top.length ? top.map(s => teamSkillRow(team, s, admin, 1))
      : hintRow(1, 'No skills at team level. Skills shared without a group appear here.'));
  }
  roots.forEach(n => groupRows(team, n, admin, 0, rows));
  return el('div', { class: 'tbl tree', role: 'table', 'aria-label': 'Skills in ' + team.name },
    el('div', { class: 'tr th-row', role: 'row' }, th('Skill'), th('Revision'), th('Pushed by'), thActions()),
    rows);
}

function groupRows(team, node, admin, depth, out) {
  const key = team.name + '\n' + node.path;
  const priv = node.g && node.g.private;
  out.push(foldRow(key, Math.min(depth, 6), {
    title: node.path, ic: priv ? 'lock' : 'folder',
    label: node.host ? node.path.slice(node.host.path.length + 1) : node.path,
    badge: priv && privateBadge(), count: countSkills(node),
    side: node.g && subscribeSwitch(team, node.g),
  }));
  if (collapsed.has(key)) return;
  const inner = Math.min(depth + 1, 7);
  if (node.skills.length) node.skills.forEach(s => out.push(teamSkillRow(team, s, admin, inner)));
  else if (!node.children.length) out.push(hintRow(inner, 'No skills in this group yet.'));
  node.children.forEach(c => groupRows(team, c, admin, depth + 1, out));
}

function teamSkillRow(team, s, admin, depth) {
  const mine = state.skills.find(x => x.name === s.name);
  const update = s.in_library && mine && mine.source && mine.source.team === team.name && mine.source.update_available;
  const fk = `ts:${team.name}:${s.name}`;
  const action = update
    ? btn('Take update', { class: 'btn primary', fk, title: `r${mine.source.revision} → r${mine.source.latest_revision}`, on: { click: ev => takeSkill(ev.currentTarget, team.name, s.name, true) } }, 'up')
    : s.in_library
      ? el('span', { class: 'in-mine' }, icon('check', 14), 'In your library')
      : btn('Add to library', { fk, on: { click: ev => takeSkill(ev.currentTarget, team.name, s.name, false) } }, 'plus');
  return el('div', { class: 'tr', role: 'row', style: `--d:${depth}` },
    td('c-main',
      el('div', { class: 'name-line' },
        el('span', { class: 'name' }, s.name),
        update && el('span', { class: 'badge info' }, el('span', { class: 'dot accent' }), 'Update available')),
      s.description && el('span', { class: 't2' }, s.description)),
    td('meta nowrap', el('span', { class: 't1 mono', title: 'Revision ' + s.revision }, 'r' + s.revision)),
    td('meta',
      el('span', { class: 't1' }, s.pushed_by),
      el('span', { class: 't2' }, when(s.updated_on))),
    td('row end',
      action,
      admin && menu(`Manage ${s.name}`, 'tsm:' + fk, [
        { label: 'Move to group…', icon: 'move', run: () => moveDialog(team, s) },
        { label: 'Remove from team', icon: 'trash', danger: true, run: () => removeTeamSkillDialog(team, s) },
      ])));
}

function moveDialog(team, s) {
  const picker = groupPicker(team, { name: 'move-group', legend: 'Move to', noneLabel: 'Team level (no group)', value: s.group || '' });
  openDialog({
    title: `Move ${s.name}`,
    submitLabel: 'Move',
    body: [el('p', null, 'Moving a skill changes who in the team can see it: a private group shows it only to the people in that group.'), picker],
    onSubmit: async () => {
      const group = picked(picker);
      await api(`/api/teams/${enc(team.name)}/skills/${enc(s.name)}/move`, { group });
      return `Moved ${s.name} to ${group ? teamLabel(team.name, group) : `team level in ${team.name}`}.`;
    },
  });
}

function removeTeamSkillDialog(team, s) {
  confirmDialog({
    title: `Remove ${s.name} from ${team.name}?`,
    submitLabel: 'Remove from team',
    lines: [
      'The team no longer has this skill, and nobody is offered it or its updates from here.',
      'People who already added it to their library keep their copy.',
    ],
    onSubmit: async () => {
      await api(`/api/teams/${enc(team.name)}/skills/${enc(s.name)}/remove`, {});
      return `Removed ${s.name} from ${team.name}. People who took it keep their copy.`;
    },
  });
}

        : m.can_invite ? el('span', { class: 'badge' }, 'Can invite') : null;

/* ---------- groups ---------- */

function groupsTab(team, admin) {
  const rows = flatten(groupTree(team)).filter(r => r.node.g);

    el('p', { class: 'muted' }, 'Groups organise a team\'s skills, like channels. A private group is seen only by the people added to it.'),

    return [head, empty('folder', 'No groups yet',
      el('p', null, admin ? 'Create a group to organise skills by topic or project. Groups can be nested, for example ' : 'An admin of this team can create groups to organise its skills.',

        : cut > 0 ? `Open to everyone who sees ${g.path.slice(0, cut)}` : `Open to everyone in ${team.name}`;
      return el('div', { class: 'tr', role: 'row', style: `--d:${Math.min(depth, 6)}` },
        td('c-main',

            g.member && el('span', { class: 'badge' }, icon('check', 11), 'You are in it')),

function newGroupDialog(team) {

function groupPeopleDialog(team, g) {
  const filter = el('input', { class: 'input', type: 'search', placeholder: 'Filter members', autocomplete: 'off', 'aria-label': 'Filter members' });
  const boxes = members(team).map(m => ({
    m, was: (m.groups || []).includes(g.path),
    box: el('input', { type: 'checkbox', checked: (m.groups || []).includes(g.path) }),
  }));
  const rows = boxes.map(b => el('label', { class: 'picker-opt' }, b.box, el('span', { class: 'avatar round' }, b.m.username[0]),
    el('span', { class: 'mono' }, b.m.username), b.m.role === 'ADMIN' && el('span', { class: 'badge' }, 'Admin')));
  filter.addEventListener('input', () => {
    const q = filter.value.trim().toLowerCase();
    boxes.forEach((b, i) => { rows[i].hidden = !!q && !b.m.username.toLowerCase().includes(q); });
  });
  openDialog({
    title: `People in ${g.path}`,
    submitLabel: 'Save',
    body: [
      el('p', null, g.private ? 'This group is private: only the people ticked here see it and its skills.' : 'This group is open: the whole team sees it. People ticked here are its members.'),
      filter,
      el('fieldset', { class: 'picker' }, el('legend', { class: 'sr-only' }, `Members of ${team.name}`), el('div', { class: 'picker-list' }, rows)),
    ],
    onSubmit: async () => {
      const changed = boxes.filter(b => b.box.checked !== b.was);
      for (const b of changed) {
        await api(`/api/teams/${enc(team.name)}/group/members`, { path: g.path, username: b.m.username, member: b.box.checked });
      }
      return changed.length ? `Updated who is in ${g.path}.` : null;
    },
  });
}

// The answers to "Where should your Library live?", each with what it costs, and what to tell
// the coding agent to move there.
const STORAGE = {
  this_computer: { title: 'Only this computer', icon: 'laptop', cost: 'Free and nothing to keep switched on. No other computer reaches it.',
                   say: 'move my AIStack Library to this computer only',
                   after: 'Your other computers can no longer reach it.' },
  github: { title: 'A private GitHub repository', icon: 'folder', cost: 'Every computer of yours shares it through your own GitHub sign-in, nothing has to stay on, and every change is in the repository\'s history.',
            say: 'move my AIStack Library to a private GitHub repository',
            after: 'Then, on each other computer, paste the setup and choose the same repository.' },
  postgresql: { title: 'A free PostgreSQL database', icon: 'layers', cost: 'Every computer of yours uses it, and nothing has to stay on. Each computer keeps its address; if a laptop is lost, reset the database password and paste the new address on the others.',
                say: 'move my AIStack Library to a PostgreSQL database',
                after: 'Then, on each other computer, paste the setup and give it the same database address.' },
  server: { title: 'An AIStack server', icon: 'globe', cost: 'Your computers reach it over the network, so it must stay on. The only choice that works for a team.' },

function storageView() {
  const lib = library();
  const here = STORAGE[lib.kind];
  const fact = (k, ...v) => [el('dt', null, k), el('dd', null, v)];
  const facts = lib.kind === 'postgresql'
    ? [fact('Database', lib.provider), fact('Host', el('span', { class: 'mono' }, lib.host))]
    : lib.kind === 'github'
    ? [fact('Repository', el('span', { class: 'mono' }, lib.repository))]
    : lib.kind === 'server' ? [fact('Server', el('span', { class: 'mono' }, location.host))]
    : [fact('Computer', 'The one showing this page')];
  facts.push(fact('Computers using it', String(state.machines.length)));
  const actions = [
    lib.kind === 'github' && el('a', { class: 'btn', href: `https://github.com/${lib.repository}`, target: '_blank', rel: 'noopener noreferrer' },
      icon('external'), el('span', null, 'Open on GitHub')),
    lib.kind !== 'this_computer' && btn('Add a computer', { fk: 'storage-add-computer', on: { click: addComputerDialog } }, 'plus'),

function setDrawer(open) {

  $drawerBtn.setAttribute('aria-expanded', String(open));
  $drawerBtn.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  if (open) {

    if (first) first.focus();

}
$drawerBtn.addEventListener('click', () => setDrawer(!$app.classList.contains('drawer-open')));

  if (ev.key === 'Escape' && $app.classList.contains('drawer-open')) { setDrawer(false); $drawerBtn.focus(); }
});

// Back on the tab, or on the window from the terminal beside it: show what changed meanwhile,
// such as a sync or a teammate joining, or that the session ended. Not while a dialog is open:
// it holds what the user is typing.
const refreshOnReturn = () => {
  if (document.visibilityState !== 'visible' || !state || document.querySelector('dialog[open]')) return;
  load().catch(e => { if (e instanceof SessionEnded) sessionEnded(); });
};
document.addEventListener('visibilitychange', refreshOnReturn);
window.addEventListener('focus', refreshOnReturn);

// A tooltip opens below its control, clear of the sticky bars, unless the window ends there.
for (const type of ['pointerover', 'focusin']) {
  document.addEventListener(type, ev => {
    const tip = ev.target.closest && ev.target.closest('[data-tip]');
    if (tip) tip.classList.toggle('tip-up', innerHeight - tip.getBoundingClientRect().bottom < 90);
  });
}

// "/" jumps to the search box, unless the user is already typing somewhere.
document.addEventListener('keydown', ev => {
  if (ev.key !== '/' || ev.metaKey || ev.ctrlKey || ev.altKey || document.querySelector('dialog[open]')) return;
  if (ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]')) return;
  const box = document.getElementById('search');
  if (box) { ev.preventDefault(); box.focus(); box.select(); }
});

function fail(message) { throw new Error(message); }
const dNow = () => new Date().toISOString();
const dMe = () => DB.user.username;
const dTeam = name => DB.teams.find(t => t.name === name) || fail(`There is no team called ${name}.`);
const dMine = name => DB.skills.find(s => s.name === name) || fail(`${name} is not in your library.`);
const dTeamSkill = (t, name) => t.skills.find(s => s.name === name) || fail(`${t.name} has no skill called ${name}.`);
const dMember = (t, username) => t.members.find(m => m.username === username) || fail(`${username} is not in ${t.name}.`);
const dGroup = (t, path) => t.groups.find(g => g.path === path) || fail(`${t.name} has no group ${path}.`);
const dAdmin = t => { if (t.role !== 'ADMIN') fail(`Only an admin of ${t.name} can do that.`); };

const DEMO_ROUTES = [
  [/^\/api\/skills\/([^/]+)\/machines\/([^/]+)$/, (b, name, id) => {
    const s = dMine(name);
    const harness = b.harness || 'claude_code';
    s.placements = s.placements.filter(p => p.machine !== id || p.harness !== harness);
    if (b.enabled) s.placements.push({ machine: id, harness });
  }],
  [/^\/api\/skills\/([^/]+)\/share$/, (b, name) => {
    const s = dMine(name), t = dTeam(b.team), group = b.group || null;
    const had = t.skills.find(x => x.name === name);
    const fromHere = !!s.source && s.source.team === t.name;
    if (had && fromHere && s.source.revision === had.revision && (had.group || null) === group) {
      return { team: t.name, group, revision: had.revision, created: false, unchanged: true, previous_pushed_by: had.pushed_by, possibly_unrelated: false };
    }
    const revision = had ? had.revision + 1 : 1, previous = had ? had.pushed_by : null;
    const copy = { name, description: s.description, group, revision, pushed_by: dMe(), updated_on: dNow(), in_library: true };
    if (had) Object.assign(had, copy); else t.skills.push(copy);
    s.source = { team: t.name, group, revision, latest_revision: revision, latest_pushed_by: dMe(), update_available: false };
    return { team: t.name, group, revision, created: !had, unchanged: false, previous_pushed_by: previous, possibly_unrelated: !!had && !fromHere };
  }],
  [/^\/api\/skills\/([^/]+)\/remove$/, (b, name) => {
    dMine(name);
    DB.skills = DB.skills.filter(s => s.name !== name);
    DB.teams.forEach(t => t.skills.forEach(s => { if (s.name === name) s.in_library = false; }));
  }],
  [/^\/api\/teams$/, b => {
    if (!NAME_RE.test(b.name)) fail(`"${b.name}" is not a valid team name. ${NAME_RULE}`);
    if (DB.teams.some(t => t.name === b.name)) fail(`A team called ${b.name} already exists. Pick another name.`);
    DB.teams.push({ name: b.name, kind: 'SHARED', role: 'ADMIN', sees_all_groups: false, members: [{ username: dMe(), role: 'ADMIN', sees_all_groups: false, groups: [] }], groups: [], skills: [] });
  }],
  [/^\/api\/teams\/join$/, b => {
    if (!/^aistinv_.+/.test(b.code)) fail('That invite code is not valid. Ask an admin of the team for a new one. (In the demo, any code starting with aistinv_ works.)');
    if (DB.teams.some(t => t.name === 'design')) fail('You are already in design.');
    DB.teams.push({ name: 'design', kind: 'SHARED', role: 'MEMBER', sees_all_groups: false,
      members: [{ username: 'eve', role: 'ADMIN', sees_all_groups: false, groups: ['tokens'] }, { username: dMe(), role: 'MEMBER', sees_all_groups: false, groups: [] }],
      groups: [{ path: 'tokens', private: false, member: false, subscribed: true }],
      skills: [{ name: 'design-tokens', description: 'Keeps colours, spacing and type in sync with the token file.', group: 'tokens', revision: 2, pushed_by: 'eve', updated_on: dNow(), in_library: false }] });
    return { team: 'design' };
  }],
  [/^\/api\/teams\/([^/]+)\/leave$/, (b, team) => {
    const t = dTeam(team);
    if (t.role === 'ADMIN' && t.members.filter(m => m.role === 'ADMIN').length === 1 && t.members.length > 1) fail(`You are the only admin of ${t.name}. Make someone else an admin before you leave.`);
    DB.teams = DB.teams.filter(x => x !== t);
    DB.skills.forEach(s => { if (s.source && s.source.team === team) s.source = null; });
  }],
  [/^\/api\/teams\/([^/]+)\/invite$/, (b, team) => {
    const t = dTeam(team);
    if (t.role !== 'ADMIN' && !t.can_invite) fail(`Only an admin of ${t.name}, or a member an admin lets invite, can do that.`);
    const bytes = crypto.getRandomValues(new Uint8Array(18));
    (t.invites = t.invites || []).unshift({ id: String(Date.now()), created_by: dMe(), created_on: dNow(), expires_on: new Date(Date.now() + 7 * 86400e3).toISOString(), status: 'PENDING', used_by: null });
    return { code: 'aistinv_' + Array.from(bytes, x => x.toString(36).padStart(2, '0')).join('').slice(0, 32) };
  }],
  [/^\/api\/teams\/([^/]+)\/invites\/([^/]+)\/cancel$/, (b, team, id) => {
    const i = (dTeam(team).invites || []).find(x => x.id === id) || fail('That invite is not there.');
    i.status = 'CANCELLED';
  }],
  [/^\/api\/teams\/([^/]+)\/take$/, (b, team) => {
    const t = dTeam(team), ts = dTeamSkill(t, b.name);
    const source = { team: t.name, group: ts.group, revision: ts.revision, latest_revision: ts.revision, latest_pushed_by: ts.pushed_by, update_available: false };
    const mine = DB.skills.find(s => s.name === b.name);
    if (mine) Object.assign(mine, { description: ts.description, revision: mine.revision + 1, pushed_by: ts.pushed_by, updated_on: dNow(), source });
    else DB.skills.push({ name: ts.name, description: ts.description, revision: 1, pushed_by: ts.pushed_by, updated_on: dNow(), files: 3, placements: [], source });
    DB.skills.sort((a, c) => a.name.localeCompare(c.name));
    ts.in_library = true;
  }],
  [/^\/api\/teams\/([^/]+)\/members\/([^/]+)$/, (b, team, username) => {
    const t = dTeam(team); dAdmin(t);
    const m = dMember(t, username);
    if (b.role && b.role !== m.role) {
      if (b.role === 'MEMBER' && t.members.filter(x => x.role === 'ADMIN').length === 1) fail(`${username} is the only admin of ${t.name}. Make someone else an admin first.`);
      m.role = b.role;
      if (username === dMe()) t.role = b.role;
    }
    if (typeof b.sees_all_groups === 'boolean') {
      m.sees_all_groups = b.sees_all_groups;
      if (username === dMe()) t.sees_all_groups = b.sees_all_groups;
    }
    if (typeof b.can_invite === 'boolean') {
      m.can_invite = b.can_invite;
      if (username === dMe()) t.can_invite = b.can_invite;
    }
  }],
  [/^\/api\/teams\/([^/]+)\/members\/([^/]+)\/remove$/, (b, team, username) => {
    const t = dTeam(team); dAdmin(t);
    dMember(t, username);
    t.members = t.members.filter(m => m.username !== username);
  }],
  [/^\/api\/teams\/([^/]+)\/groups$/, (b, team) => {
    const t = dTeam(team); dAdmin(t);
    if (!NAME_RE.test(b.name)) fail(`"${b.name}" is not a valid group name. ${NAME_RULE}`);
    if (b.parent) dGroup(t, b.parent);
    const path = b.parent ? `${b.parent}/${b.name}` : b.name;
    if (t.groups.some(g => g.path === path)) fail(`${t.name} already has a group ${path}.`);
    t.groups.push({ path, private: !!b.private, member: true, subscribed: true });
    dMember(t, dMe()).groups.push(path);
    return { path };
  }],
  [/^\/api\/teams\/([^/]+)\/group$/, (b, team) => {
    const t = dTeam(team), g = dGroup(t, b.path);
    if (typeof b.private === 'boolean') { dAdmin(t); g.private = b.private; }
    if (typeof b.subscribed === 'boolean') g.subscribed = b.subscribed;
  }],
  [/^\/api\/teams\/([^/]+)\/group\/members$/, (b, team) => {
    const t = dTeam(team); dAdmin(t);
    const g = dGroup(t, b.path), m = dMember(t, b.username);
    m.groups = m.groups.filter(p => p !== b.path);
    if (b.member) m.groups.push(b.path);
    m.groups.sort();
    if (b.username === dMe()) g.member = !!b.member;
  }],
  [/^\/api\/teams\/([^/]+)\/skills\/([^/]+)\/move$/, (b, team, name) => {
    const t = dTeam(team); dAdmin(t);
    const s = dTeamSkill(t, name);
    if (b.group) dGroup(t, b.group);
    s.group = b.group || null;
    DB.skills.forEach(x => { if (x.name === name && x.source && x.source.team === team) x.source.group = s.group; });
  }],
  [/^\/api\/teams\/([^/]+)\/skills\/([^/]+)\/remove$/, (b, team, name) => {
    const t = dTeam(team); dAdmin(t);
    dTeamSkill(t, name);
    t.skills = t.skills.filter(s => s.name !== name);
    DB.skills.forEach(x => { if (x.name === name && x.source && x.source.team === team) x.source = null; });
  }],
  [/^\/api\/machines\/([^/]+)\/remove$/, (b, id) => {
    const m = DB.machines.find(x => x.id === id) || fail(`You have no computer '${id}'.`);
    if (DB.machines.length === 1) fail(`'${m.name}' is your only computer, so it cannot be removed: you would have no way back in. Add the computer you use instead first, then remove this one.`);
    DB.machines = DB.machines.filter(x => x !== m);
    DB.machines.forEach(x => { if (x.added_by === m.name) { x.added_by = null; x.added_by_removed = true; } });
    DB.skills.forEach(s => { s.placements = s.placements.filter(p => p.machine !== id); });
    return { removed: m.name };
  }],
  [/^\/api\/machines\/([^/]+)\/rename$/, (b, id) => {
    const m = DB.machines.find(x => x.id === id) || fail(`You have no computer '${id}'.`);
    const name = (b.name || '').trim();
    if (!name) fail('name is blank. Give a name with at least one non-whitespace character.');
    if (DB.machines.some(x => x !== m && x.name === name)) fail(`You already have a computer named '${name}'. Pick another name.`);
    DB.machines.forEach(x => { if (x.added_by === m.name) x.added_by = name; });
    m.name = name;
    return { name };
  }],
  [/^\/api\/logout$/, () => {}],
];

async function demoApi(path, body) {
  await new Promise(r => setTimeout(r, 220));
  if (path === '/api/state') return JSON.parse(JSON.stringify(DB));
  for (const [re, handler] of DEMO_ROUTES) {
    const m = re.exec(path);
    if (m) return handler(body || {}, ...m.slice(1).map(decodeURIComponent)) || {};
  }
  fail(`The demo does not know ${path}.`);
}

/* ================= start ================= */

function start() {
  load().catch(e => {
    if (e instanceof SessionEnded) return sessionEnded();
    $main.replaceChildren(el('div', { class: 'wrap body' }, empty('info', 'The dashboard could not load', el('p', null, e.message),
      btn('Try again', { class: 'btn primary', on: { click: ev => { ev.currentTarget.setAttribute('aria-disabled', 'true'); start(); } } }))));
  });
}
start();
})();
</script>
