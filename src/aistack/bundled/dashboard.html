<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AIStack</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafafa;
  --band: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4f4f4;
  --head: #fafafa;
  --active: #ebebeb;
  --border: #eaeaea;
  --border-strong: #d4d4d4;
  --track: #8f8f8f; /* 3.2:1 on white: an off switch must still be seen */
  --text: #0a0a0a;
  --ink-hover: #383838;
  --inverse: #ffffff;
  --muted: #5e5e5e;
  --faint: #707070;
  --blue: #0060d1;
  --blue-dot: #0070f3;
  --blue-soft: #edf5ff;
  --purple: #7422b8;
  --purple-soft: #f8f1fe;
  --amber-dot: #f5a623;
  --danger: #c4242b;
  --danger-soft: #fff0f0;
  --ok: #1f8a3d;
  --scrim: rgba(0, 0, 0, .4);
  --shadow-menu: 0 0 0 1px rgba(0, 0, 0, .03), 0 2px 4px rgba(0, 0, 0, .04), 0 12px 28px -6px rgba(0, 0, 0, .14);
  --shadow-lg: 0 0 0 1px rgba(0, 0, 0, .03), 0 2px 4px rgba(0, 0, 0, .04), 0 16px 32px -8px rgba(0, 0, 0, .12), 0 40px 80px -16px rgba(0, 0, 0, .2);
  --r-sm: 6px;
  --r: 8px;
  --top: 56px;
  --side: 240px;
  --gutter: 32px;
  --step: 24px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --band: #000000;
    --surface: #0a0a0a;
    --surface-2: #171717;
    --head: #0f0f0f;
    --active: #1f1f1f;
    --border: #222222;
    --border-strong: #363636;
    --track: #6b6b6b;
    --text: #ededed;
    --ink-hover: #cfcfcf;
    --inverse: #000000;
    --muted: #a1a1a1;
    --faint: #8a8a8a;
    --blue: #52a8ff;
    --blue-dot: #3291ff;
    --blue-soft: #0a1b30;
    --purple: #c58bf2;
    --purple-soft: #1c1028;
    --amber-dot: #f5a623;
    --danger: #ff6166;
    --danger-soft: #2a1012;
    --ok: #62c073;
    --scrim: rgba(0, 0, 0, .72);
    --shadow-menu: 0 0 0 1px rgba(255, 255, 255, .04), 0 12px 28px -6px rgba(0, 0, 0, .9);
    --shadow-lg: 0 0 0 1px rgba(255, 255, 255, .04), 0 24px 64px -8px rgba(0, 0, 0, 1);
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, p, ul, ol, fieldset { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg.ico { flex: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: var(--r-sm); }
::selection { background: var(--text); color: var(--inverse); }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -.01em; }
code, kbd { font-family: var(--mono); font-size: 12px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.dot { flex: none; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.dot.blue { background: var(--blue-dot); }
.dot.amber { background: var(--amber-dot); }

/* ---------- shell ---------- */
#app {
  display: grid; min-height: 100vh;
  grid-template-columns: var(--side) minmax(0, 1fr);
  grid-template-rows: var(--top) 1fr;
  grid-template-areas: "top top" "side main";
}
.topbar {
  grid-area: top; position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  height: var(--top); padding: 0 20px;
  background: var(--band); border-bottom: 1px solid var(--border);
}
.topbar .drawer-btn { display: none; }
.crumbs { flex: 1; min-width: 0; }
.crumbs ol { display: flex; align-items: center; gap: 4px; min-width: 0; }
.crumbs li { display: flex; min-width: 0; }
.crumbs .sep { flex: none; color: var(--border-strong); font-size: 20px; font-weight: 300; line-height: 1; padding: 0 2px; transform: skewX(-8deg); }
.crumb {
  display: inline-flex; align-items: center; gap: 10px; min-width: 0;
  height: 32px; padding: 0 8px; border-radius: var(--r-sm);
  color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.crumb.mono { font-size: 13px; display: block; line-height: 32px; }
a.crumb:hover { background: var(--surface-2); color: var(--text); }
.crumb.home { color: var(--text); font-weight: 600; letter-spacing: -.02em; font-size: 15px; padding-left: 0; overflow: visible; }
a.crumb.home:hover { background: none; }
.crumb.cur { color: var(--text); }
.logo { flex: none; width: 24px; height: 24px; border-radius: 6px; background: var(--text); color: var(--inverse); display: grid; place-items: center; }
.top-right { display: flex; align-items: center; gap: 8px; }

.sidebar {
  grid-area: side; position: sticky; top: var(--top); height: calc(100vh - var(--top));
  display: flex; flex-direction: column;
  background: var(--bg); border-right: 1px solid var(--border);
  padding: 16px 12px 12px;
  overflow-y: auto;
}
.side-brand { display: none; }
.side-brand .grow { flex: 1; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item, .nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  height: 32px; padding: 0 8px; border: 0; border-radius: var(--r-sm);
  background: none; color: var(--muted); min-width: 0; cursor: pointer; text-align: left;
}
.nav-item svg, .nav-btn svg { color: var(--faint); }
.nav-item:hover, .nav-btn:hover { background: var(--active); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--active); color: var(--text); font-weight: 500; }
.nav-item[aria-current="page"] svg, .nav-item:hover svg, .nav-btn:hover svg { color: var(--text); }
.nav-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.nav-item .label.mono { font-size: 13px; }
.nav-item .count { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.nav-item .count.upd { color: var(--blue); }
.nav-heading { display: flex; align-items: center; height: 32px; margin-top: 16px; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--faint); }
.nav-actions { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.sidebar-foot {
  margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.sidebar-foot .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 13px; padding-left: 2px; }
.avatar {
  flex: none; width: 24px; height: 24px; border-radius: 6px;
  display: grid; place-items: center;
  background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
  font: 600 11px var(--mono); text-transform: uppercase;
}
.avatar.round { border-radius: 50%; }
.avatar.xs { width: 16px; height: 16px; border-radius: 4px; font-size: 9px; color: var(--muted); }
.avatar.lg { width: 44px; height: 44px; border-radius: 8px; font-size: 18px; background: var(--text); color: var(--inverse); border-color: var(--text); }
.scrim { display: none; }

main { grid-area: main; min-width: 0; }
main:focus { outline: none; }
.band { background: var(--band); border-bottom: 1px solid var(--border); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }
.band > .wrap { padding-top: 32px; padding-bottom: 32px; }
.band.has-tabs > .wrap { padding-bottom: 0; }
.wrap.body { padding-top: 24px; padding-bottom: 96px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; }
.page-head .titles { flex: 1 1 260px; min-width: 0; }
h1 { font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -.04em; overflow-wrap: anywhere; }
.subtitle { color: var(--muted); margin-top: 6px; }
.team-head { display: flex; align-items: center; gap: 16px; }
.team-head .titles { min-width: 0; }
.team-head .line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.team-head .subtitle { margin-top: 2px; font-size: 13px; }
.note { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; color: var(--muted); font-size: 13px; }
.note svg { margin-top: 3px; color: var(--faint); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--text);
  font-size: 13.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--faint); }
.btn svg { color: var(--muted); }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--inverse); }
.btn.primary svg { color: inherit; }
.btn.primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn.danger { color: var(--danger); }
.btn.danger svg { color: inherit; }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--inverse); }
.btn.danger.solid:hover { filter: brightness(.92); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--active); border-color: transparent; color: var(--text); }
.btn.ghost:hover svg { color: var(--text); }
.btn.icon { width: 32px; padding: 0; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
[aria-disabled="true"] { opacity: .55; pointer-events: none; }
[aria-busy="true"] { cursor: progress; }
:disabled { opacity: .5; cursor: not-allowed; }

.input {
  width: 100%; height: 32px; padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--text);
  transition: border-color .12s, box-shadow .12s;
}
.input::placeholder { color: var(--faint); opacity: 1; }
.input:hover { border-color: var(--faint); }
.input:focus-visible { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--text) 14%, transparent); }
.input[type="search"]::-webkit-search-cancel-button { display: none; }
select.input { padding-right: 8px; }
select.input.compact { width: auto; height: 28px; padding-left: 8px; font-size: 13px; }
.search { position: relative; flex: 0 1 300px; min-width: 180px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search .input { padding-left: 32px; padding-right: 36px; }
.search kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); line-height: 16px; color: var(--muted); pointer-events: none; }
.search:focus-within kbd { display: none; }

.switch {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 28px; padding: 2px 4px;
  border: 0; border-radius: var(--r-sm); background: none;
  color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap;
}
.switch:hover { color: var(--text); }
.switch .track { flex: none; position: relative; width: 28px; height: 16px; border-radius: 8px; background: var(--track); transition: background .15s; }
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
  border-radius: 50%; background: #fff; transition: transform .15s, background .15s;
}
.switch[aria-checked="true"] { color: var(--text); }
.switch[aria-checked="true"] .track { background: var(--text); }
.switch[aria-checked="true"] .track::after { transform: translateX(12px); background: var(--inverse); }
.switch:disabled .track { opacity: .6; }
.switch .mono { font-size: 12.5px; }
[data-tip]:hover::after, [data-tip]:focus-visible::after {
  content: attr(data-tip);
  position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 20;
  width: max-content; max-width: 260px; padding: 6px 10px;
  border-radius: var(--r-sm); background: var(--text); color: var(--inverse);
  font: 400 12px/1.4 var(--font); white-space: normal; text-align: left;
  box-shadow: var(--shadow-menu); pointer-events: none;
}

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap; max-width: 100%;
}
.badge.mono { font: 500 11.5px/1 var(--mono); }
.badge.solid { background: var(--text); border-color: var(--text); color: var(--inverse); }
.badge.info { background: var(--blue-soft); border-color: transparent; color: var(--blue); }
.badge.private { background: var(--purple-soft); border-color: transparent; color: var(--purple); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
.stat { padding: 16px 20px 14px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--border); }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { display: flex; align-items: center; gap: 10px; font-size: 28px; line-height: 1.25; font-weight: 600; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

/* ---------- tables ---------- */
.tbl { display: grid; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
.tbl.mine { grid-template-columns: minmax(220px, 1fr) fit-content(200px) auto auto fit-content(280px) auto; }
.tbl.tree { grid-template-columns: minmax(0, 1fr) auto auto auto; }
.tbl.groups { --gx: 8px; }
.tr {
  --d: 0;
  display: grid; grid-template-columns: subgrid; grid-column: 1 / -1;
  border-top: 1px solid var(--border);
  transition: background-color .1s;
}
.tr:last-child { border-radius: 0 0 7px 7px; }
.tr:not(.th-row):not(.grp):not(.hint-row):hover { background-color: var(--head); }
.th-row {
  position: sticky; top: var(--top); z-index: 5;
  border-top: 0; border-radius: 7px 7px 0 0;
  background: var(--head); box-shadow: 0 1px 0 var(--border);
}
.th { display: flex; align-items: center; height: 36px; padding: 0 16px; font-size: 12px; font-weight: 500; color: var(--faint); white-space: nowrap; }
.th-sort { display: inline-flex; align-items: center; gap: 4px; height: 24px; margin: 0 -6px; padding: 0 6px; border: 0; border-radius: 4px; background: none; color: inherit; font-weight: inherit; cursor: pointer; }
.th-sort:hover { color: var(--text); background: var(--active); }
.th-sort .arrow { display: inline-flex; opacity: 0; transition: transform .15s; }
.th-sort:hover .arrow, .th-sort:focus-visible .arrow { opacity: .5; }
.th-sort .arrow.on { opacity: 1; color: var(--text); }
.th-sort .arrow.desc { transform: rotate(180deg); }
[aria-sort="ascending"] .th-sort, [aria-sort="descending"] .th-sort { color: var(--text); }
.td { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 12px; }
.th { padding: 0 12px; }
.td:first-child, .th:first-child { padding-left: 16px; }
.td:last-child, .th:last-child { padding-right: 16px; }
.td.row { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 4px 8px; }
.td.end { justify-content: flex-end; flex-wrap: nowrap; }
.td.nowrap { white-space: nowrap; }
.tr > .c-main { padding-left: calc(16px + var(--d) * var(--step)); }
/* Indent guides: one hairline per ancestor, drawn under the parent's chevron. */
.tr.grp, .tr.hint-row, .tr > .c-main {
  background-image: repeating-linear-gradient(90deg, var(--border-strong) 0 1px, transparent 1px var(--step));
  background-repeat: no-repeat;
  background-size: max(0px, calc(var(--d) * var(--step) - var(--step) + 1px)) 100%;
  background-position: calc(16px + var(--gx, var(--step) / 2)) 0;
}
.name { font: 600 13.5px/1.5 var(--mono); letter-spacing: -.01em; overflow-wrap: anywhere; }
.name-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.t1 { color: var(--text); overflow-wrap: anywhere; }
.t1.rev { display: inline-flex; align-items: center; gap: 6px; }
.t2 { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
a.link { text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
a.link:hover { text-decoration-color: var(--text); }
.machines { display: flex; flex-wrap: wrap; gap: 0 12px; }
.td.update-cell { grid-column: 1 / -1; padding: 0 16px 12px; }
.update {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  padding: 6px 6px 6px 12px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--head); font-size: 13px;
}
.update strong { font-weight: 500; }
.update .grow { flex: 1 1 auto; color: var(--muted); }
.in-mine { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.tbl-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 24px; margin-top: 12px; padding: 0 2px; color: var(--muted); font-size: 13px; }
.tbl-foot .count { font: 12px/1.6 var(--mono); color: var(--faint); }

/* group header rows inside the skills tree */
.tr.grp, .tr.hint-row { display: flex; align-items: center; }
.tr.grp { min-height: 44px; padding: 0 12px 0 calc(16px + var(--d) * var(--step)); background-color: var(--head); }
.grp-cell { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.group-toggle {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
}
.group-toggle .chev { flex: none; width: var(--step); display: grid; place-items: center; color: var(--faint); transition: transform .15s; }
.group-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.group-toggle:hover .chev, .group-toggle:hover .gicon { color: var(--text); }
.group-toggle .gname { font: 600 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-toggle .gname.plain { font: 600 13.5px var(--font); }
.group-toggle .gicon { display: inline-flex; color: var(--muted); margin-left: -4px; }
.group-toggle .count { color: var(--faint); font: 12px var(--mono); white-space: nowrap; }
.tr.hint-row { padding: 12px 16px 12px calc(16px + var(--d) * var(--step)); color: var(--muted); font-size: 13px; }
.tree-name { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.tree-name .gicon { display: inline-flex; color: var(--muted); }
.tree-name .path { font: 600 13px var(--mono); overflow-wrap: anywhere; }
.tree-name .parent { color: var(--faint); font-weight: 400; }

.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
  padding: 64px 24px;
  background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--r);
}
.empty .glyph { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--head); color: var(--muted); margin-bottom: 8px; }
.empty h2 { font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
.empty p { color: var(--muted); max-width: 440px; }
.empty .btn { margin-top: 8px; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; margin: 24px -12px -1px; padding: 0 0 0 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 12px;
  border: 0; background: none;
  color: var(--muted); white-space: nowrap; cursor: pointer;
}
.tab::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: transparent; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 500; }
.tab[aria-selected="true"]::after { background: var(--text); }
.tab:focus-visible { outline-offset: -4px; }

.panel-head p { flex: 1 1 320px; }

/* ---------- menu ---------- */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30;
  min-width: 200px; padding: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);

/* ---------- dialog ---------- */
dialog.dlg {

/* ---------- toasts ---------- */

/* ---------- skeleton / full-page ---------- */

@keyframes pulse { 50% { opacity: .45; } }

<script>
(() => {
'use strict';

const NAME_RE = /^[a-z0-9]+(?:[._-][a-z0-9]+)*$/;
const NAME_RULE = 'Use lowercase letters and digits, joined by single ".", "-" or "_" (for example "backend" or "data-eng").';
const SYNC = 'sync aistack';
const enc = encodeURIComponent;

let DEMO = new URLSearchParams(location.search).has('demo');
let state = null;          // the last GET /api/state
let search = '';
const collapsed = new Set(); // "team\npath" of collapsed groups in the Skills tree

const $app = document.getElementById('app');
const $main = document.getElementById('main');
const $sidebar = document.getElementById('sidebar');
const $toasts = document.getElementById('toasts');
const $drawerBtn = document.getElementById('drawer-btn');

/* ================= DOM helpers ================= */

// Everything on the page is built through el(): strings become text nodes, never markup.
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null) continue;
    if (k === 'class') n.className = v || '';
    else if (k === 'on') for (const [e, f] of Object.entries(v)) n.addEventListener(e, f);
    else if (k === 'fk') n.dataset.fk = v; // focus key: lets focus survive a re-render
    else if (k in n && !k.includes('-')) n[k] = v;
    else n.setAttribute(k, String(v));
  }
  n.append(...kids.flat(Infinity).filter(k => k != null && k !== false && k !== ''));
  return n;
}

const ICONS = {
  lock: 'M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM7 11V7a5 5 0 0 1 10 0v4',
  globe: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z',
  search: 'M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM21 21l-4.35-4.35',
  plus: 'M12 5v14M5 12h14',
  more: 'M12 12h.01M19 12h.01M5 12h.01',
  chev: 'M9 18l6-6-6-6',
  check: 'M20 6L9 17l-5-5',
  x: 'M18 6L6 18M6 6l12 12',
  copy: 'M11 9h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1',
  users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
  share: 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13',
  up: 'M12 19V5M5 12l7-7 7 7',
  trash: 'M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
  folder: 'M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z',
  logout: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
  layers: 'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
  key: 'M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4',
  info: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01',
  move: 'M5 12h14M12 5l7 7-7 7',
};
function icon(name, size = 16) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  const attrs = { class: 'ico', viewBox: '0 0 24 24', width: size, height: size, fill: 'none', stroke: 'currentColor',
    'stroke-width': name === 'more' ? 3 : 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' };
  for (const [k, v] of Object.entries(attrs)) svg.setAttribute(k, v);
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', ICONS[name]);
  svg.append(p);
  return svg;
}

function btn(label, props = {}, ic) {
  return el('button', { type: 'button', class: 'btn', ...props }, ic && icon(ic), label && el('span', null, label));
}
const byFk = fk => document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
function when(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const s = (d - Date.now()) / 1000;
  let text = 'just now';
  for (const [unit, n] of [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60]]) {
    if (Math.abs(s) >= n) { text = rtf.format(Math.round(s / n), unit); break; }
  }
  return el('time', { datetime: iso, title: d.toLocaleString() }, text);
}

function sw(on, text, { fk, label, tip, disabled, onToggle }) {
  const b = el('button', {
    type: 'button', class: 'switch', role: 'switch', fk, disabled,
    'aria-checked': String(on), 'aria-label': label, 'data-tip': tip, 'aria-description': tip,
  }, el('span', { class: 'track' }), text && el('span', null, text));
  b.addEventListener('click', () => onToggle(b, !on));
  return b;
}

function empty(ic, title, ...body) {
  return el('div', { class: 'empty' }, el('div', { class: 'glyph' }, icon(ic, 22)), el('h2', null, title), body);
}

/* ================= toasts ================= */

function toast(text, kind = 'ok') {
  const t = el('div', { class: 'toast ' + kind, role: kind === 'error' ? 'alert' : null },
    el('span', { class: 'dot' }),
    el('p', null, text),
    btn(null, { class: 'btn ghost icon', 'aria-label': 'Dismiss', on: { click: () => t.remove() } }, 'x'));
  $toasts.append(t);
  while ($toasts.children.length > 4) $toasts.firstChild.remove();
  setTimeout(() => t.remove(), kind === 'ok' ? 6000 : 10000);
}

/* ================= API ================= */

class SessionEnded extends Error {}

async function api(path, body) {
  if (DEMO) return demoApi(path, body);
  const init = { credentials: 'same-origin' };
  if (body !== undefined) {
    init.method = 'POST';
    init.headers = { 'Content-Type': 'application/json', 'X-AIStack-Request': '1' };
    init.body = JSON.stringify(body);
  }
  let res;
  try {
    res = await fetch(path, init);
  } catch (_) {
    const e = new Error('Could not reach the AIStack server. Check your connection and try again.');
    e.network = true;
    throw e;
  }
  if (res.status === 401) throw new SessionEnded();
  let data = null;
  try { data = await res.json(); } catch (_) { /* not JSON: handled below */ }
  if (!res.ok) throw new Error(data && typeof data.error === 'string' ? data.error : `The server answered with status ${res.status}. Try again.`);
  return data || {};
}

async function load() {
  try {
    state = await api('/api/state');
  } catch (e) {
    // Opened straight from disk: there is no server to talk to, so show the demo.
    if (!DEMO && e.network && location.protocol === 'file:') {
      DEMO = true;
      state = await api('/api/state');
    } else throw e;
  }
  render();
}

// Runs one action: marks the control busy, re-fetches state on success, reports the outcome.
// fn returns a toast message, {text, kind}, or a function to call once the page is fresh.
async function run(control, fn, onError = m => toast(m, 'error')) {
  if (control) {
    if (control.getAttribute('aria-busy')) return false;
    control.setAttribute('aria-busy', 'true');
    control.setAttribute('aria-disabled', 'true');
  }
  try {
    const out = await fn();
    await load();
    if (typeof out === 'function') out();
    else if (typeof out === 'string') toast(out);
    else if (out) toast(out.text, out.kind);
    return true;
  } catch (e) {
    if (e instanceof SessionEnded) sessionEnded();
    else onError(e.message);
    return false;
  } finally {
    if (control) { control.removeAttribute('aria-busy'); control.removeAttribute('aria-disabled'); }
  }
}

/* ================= dialogs ================= */

let dialogSeq = 0;
let lastFk = null;
document.addEventListener('click', ev => {
  const hit = ev.target.closest && ev.target.closest('[data-fk]');
  if (hit) lastFk = hit.dataset.fk;
}, true);
// Native <dialog>.showModal() gives the focus trap, Escape, and the inert background.
function openDialog({ title, body, submitLabel = 'Save', danger, onSubmit, cancelLabel = 'Cancel', returnFk }) {
  const opener = document.activeElement;
  // Safari does not focus a button on click, so fall back to the last control clicked.
  const fk = returnFk || (opener && opener.dataset && opener.dataset.fk) || lastFk;
  const id = 'dlg-' + (++dialogSeq);
  const err = el('p', { class: 'form-error', role: 'alert', hidden: true });
  const submit = btn(submitLabel, { type: 'submit', class: 'btn ' + (danger ? 'danger solid' : 'primary') });
  const form = el('form', { method: 'dialog', novalidate: true },
    el('div', { class: 'dlg-head' },
      el('h2', { id }, title),
      btn(null, { class: 'btn ghost icon', 'aria-label': 'Close', on: { click: () => dlg.close() } }, 'x')),
    el('div', { class: 'dlg-body' }, body, err),
    el('div', { class: 'dlg-foot' },
      cancelLabel && btn(cancelLabel, { on: { click: () => dlg.close() } }),
      submit));
  const dlg = el('dialog', { class: 'dlg', 'aria-labelledby': id }, form);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    err.hidden = true;
    if (!onSubmit) return dlg.close();
    let after;
    const ok = await run(submit, async () => {
      const out = await onSubmit();
      if (typeof out === 'function') { after = out; return null; }
      return out;
    }, m => { err.textContent = m; err.hidden = false; });
    if (ok) { dlg.close(); if (after) after(); }
  });
  dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => {
    dlg.remove();
    if (document.querySelector('dialog[open]')) return; // a follow-up dialog owns focus now
    const target = opener && opener.isConnected && opener !== document.body ? opener : fk && byFk(fk);
    if (target) target.focus();
  });

      on: { click: () => { close(); trigger.focus(); it.run(); } } }, it.icon)));
  const trigger = btn(null, { class: 'btn ghost icon', fk, 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-label': label,
    on: { click: () => (list.hidden ? open() : close()) } }, 'more');
  const wrap = el('div', { class: 'menu-wrap' }, trigger, list);
  const outside = ev => { if (!wrap.contains(ev.target)) close(); };
  function open() {
    list.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
    list.firstChild.focus();
    document.addEventListener('pointerdown', outside, true);
  }
  function close() {
    list.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    document.removeEventListener('pointerdown', outside, true);

  wrap.addEventListener('keydown', ev => {
    if (list.hidden) return;
    const all = [...list.children], i = all.indexOf(document.activeElement);
    if (ev.key === 'Escape') { ev.stopPropagation(); close(); trigger.focus(); }
    else if (ev.key === 'Tab') close();

    else if (ev.key === 'ArrowUp') { ev.preventDefault(); all[(i - 1 + all.length) % all.length].focus(); }

/* ================= model helpers ================= */

const teamBy = name => state.teams.find(t => t.name === name);
const members = team => team.members || [];
const byPath = (a, b) => (a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
const isUnder = (path, ancestor) => path.startsWith(ancestor + '/');
const teamLabel = (team, group) => (group ? `${team} / ${group}` : team);

// A skill can be shared into a group the user is in, or any group below one.
function mayShareInto(team, path) {
  return team.groups.some(g => g.member && (g.path === path || isUnder(path, g.path)));
}
// The nearest group above `path` the user unsubscribed from, which switches this one off too.
function unsubscribedVia(team, path) {
  const hit = team.groups.filter(g => !g.subscribed && isUnder(path, g.path)).sort(byPath)[0];
  return hit ? hit.path : null;
}

// Groups as a tree. A group whose parent the user cannot see hangs from the nearest one they can.
function groupTree(team) {
  const paths = new Set(team.groups.map(g => g.path));
  team.skills.forEach(s => { if (s.group) paths.add(s.group); });
  const nodes = new Map(), roots = [];
  for (const path of [...paths].sort()) {
    const g = team.groups.find(x => x.path === path);
    const node = { path, g, host: null, children: [], skills: team.skills.filter(s => s.group === path) };
    let up = path;
    while (up.includes('/') && !node.host) {
      up = up.slice(0, up.lastIndexOf('/'));
      node.host = nodes.get(up) || null;
    }
    (node.host ? node.host.children : roots).push(node);
    nodes.set(path, node);
  }
  return roots;
}
const countSkills = node => node.skills.length + node.children.reduce((n, c) => n + countSkills(c), 0);
function flatten(nodes, depth = 0, out = []) {
  for (const n of nodes) { out.push({ node: n, depth }); flatten(n.children, depth + 1, out); }
  return out;
}

function foldRow(key, depth, { title, ic, label, plain, badge, count, side }) {
  const open = !collapsed.has(key);
  return el('div', { class: 'tr grp', role: 'row', style: `--d:${depth}` },
    el('div', { class: 'grp-cell', role: 'cell' },
      el('button', {
        type: 'button', class: 'group-toggle', fk: 'grp:' + key, 'aria-expanded': String(open), title,
        on: { click: () => { if (open) collapsed.add(key); else collapsed.delete(key); render(); } },
      },
        el('span', { class: 'chev' }, icon('chev', 14)),
        el('span', { class: 'gicon' }, icon(ic, 15)),
        el('span', { class: 'gname' + (plain ? ' plain' : '') }, label),
        badge,
        el('span', { class: 'count' }, plural(count, 'skill'))),
      side));
}

function skillsTab(team, admin) {
  const roots = groupTree(team);
  if (!team.skills.length && !roots.length) {
    return empty('layers', 'No skills in this team yet',
      el('p', null, 'Share one of your skills to get it started: open My skills and choose "Share…". The team gets its own copy.'),
      btn('Open My skills', { on: { click: () => go('#/mine') } }));
  }
  const top = team.skills.filter(s => !s.group);
  const topKey = team.name + '\n'; // no group path is empty, so this cannot collide with one
  const rows = [foldRow(topKey, 0, { title: 'Skills shared without a group', ic: 'users', label: 'Team level', plain: true, count: top.length })];
  if (!collapsed.has(topKey)) {
    rows.push(top.length ? top.map(s => teamSkillRow(team, s, admin, 1))
      : hintRow(1, 'No skills at team level. Skills shared without a group appear here.'));
  }
  roots.forEach(n => groupRows(team, n, admin, 0, rows));
  return el('div', { class: 'tbl tree', role: 'table', 'aria-label': 'Skills in ' + team.name },
    el('div', { class: 'tr th-row', role: 'row' }, th('Skill'), th('Revision'), th('Pushed by'), thActions()),
    rows);
}

function groupRows(team, node, admin, depth, out) {
  const key = team.name + '\n' + node.path;
  const priv = node.g && node.g.private;
  out.push(foldRow(key, Math.min(depth, 6), {
    title: node.path, ic: priv ? 'lock' : 'folder',
    label: node.host ? node.path.slice(node.host.path.length + 1) : node.path,
    badge: priv && privateBadge(), count: countSkills(node),
    side: node.g && subscribeSwitch(team, node.g),
  }));
  if (collapsed.has(key)) return;
  const inner = Math.min(depth + 1, 7);
  if (node.skills.length) node.skills.forEach(s => out.push(teamSkillRow(team, s, admin, inner)));
  else if (!node.children.length) out.push(hintRow(inner, 'No skills in this group yet.'));
  node.children.forEach(c => groupRows(team, c, admin, depth + 1, out));
}

function teamSkillRow(team, s, admin, depth) {
  const mine = state.skills.find(x => x.name === s.name);
  const update = s.in_my_skills && mine && mine.source && mine.source.team === team.name && mine.source.update_available;
  const fk = `ts:${team.name}:${s.name}`;
  const action = update
    ? btn('Take update', { class: 'btn primary', fk, title: `r${mine.source.revision} → r${mine.source.latest_revision}`, on: { click: ev => takeSkill(ev.currentTarget, team.name, s.name, true) } }, 'up')
    : s.in_my_skills
      ? el('span', { class: 'in-mine' }, icon('check', 14), 'In my skills')
      : btn('Add to my skills', { fk, on: { click: ev => takeSkill(ev.currentTarget, team.name, s.name, false) } }, 'plus');
  return el('div', { class: 'tr', role: 'row', style: `--d:${depth}` },
    td('c-main',
      el('div', { class: 'name-line' },
        el('span', { class: 'name' }, s.name),
        update && el('span', { class: 'badge info' }, el('span', { class: 'dot blue' }), 'Update available')),
      s.description && el('span', { class: 't2' }, s.description)),
    td('meta nowrap', el('span', { class: 't1 mono', title: 'Revision ' + s.revision }, 'r' + s.revision)),
    td('meta nowrap',
      el('span', { class: 't1' }, s.pushed_by),
      el('span', { class: 't2' }, when(s.updated_on))),
    td('row end wide',
      action,
      admin && menu(`More actions for ${s.name}`, 'tsm:' + fk, [
        { label: 'Move to group…', icon: 'move', run: () => moveDialog(team, s) },
        { label: 'Remove from team', icon: 'trash', danger: true, run: () => removeTeamSkillDialog(team, s) },
      ])));
}

function moveDialog(team, s) {
  const picker = groupPicker(team, { name: 'move-group', legend: 'Move to', noneLabel: 'Team level (no group)', value: s.group || '' });
  openDialog({
    title: `Move ${s.name}`,
    submitLabel: 'Move',
    body: [el('p', null, 'Moving a skill changes who in the team can see it: a private group shows it only to the people in that group.'), picker],
    onSubmit: async () => {
      const group = picked(picker);
      await api(`/api/teams/${enc(team.name)}/skills/${enc(s.name)}/move`, { group });
      return `Moved ${s.name} to ${group ? teamLabel(team.name, group) : `team level in ${team.name}`}.`;
    },
  });
}

function removeTeamSkillDialog(team, s) {
  confirmDialog({
    title: `Remove ${s.name} from ${team.name}?`,
    submitLabel: 'Remove from team',

      await api(`/api/teams/${enc(team.name)}/skills/${enc(s.name)}/remove`, {});

        ? sw(!!m.sees_all_groups, 'Sees all groups', {

function newGroupDialog(team) {
  const name = el('input', { class: 'input', type: 'text', autocomplete: 'off', spellcheck: false, maxLength: 64, placeholder: 'aistack' });
  const parent = groupPicker(team, { name: 'parent', legend: 'Inside (optional)', noneLabel: 'Top level of ' + team.name });
  const priv = el('input', { type: 'checkbox' });
  openDialog({
    title: `New group in ${team.name}`,
    submitLabel: 'Create group',
    body: [
      field('Name', name, NAME_RULE),
      parent,
      el('label', { class: 'check' }, priv, el('span', null, 'Private', el('small', null, 'Only people you add to the group see it and its skills.'))),
    ],
    onSubmit: async () => {
      const value = name.value.trim();
      checkName(value, 'group');
      const res = await api(`/api/teams/${enc(team.name)}/groups`, { name: value, parent: picked(parent), private: priv.checked });
      return `Created the group ${res.path || value} in ${team.name}.`;
    },
  });
}

function groupPeopleDialog(team, g) {
  const filter = el('input', { class: 'input', type: 'search', placeholder: 'Filter members', autocomplete: 'off', 'aria-label': 'Filter members' });
  const boxes = members(team).map(m => ({
    m, was: (m.groups || []).includes(g.path),
    box: el('input', { type: 'checkbox', checked: (m.groups || []).includes(g.path) }),
  }));
  const rows = boxes.map(b => el('label', { class: 'picker-opt' }, b.box, el('span', { class: 'avatar round' }, b.m.username[0]),
    el('span', { class: 'mono' }, b.m.username), b.m.role === 'ADMIN' && el('span', { class: 'badge' }, 'Admin')));
  filter.addEventListener('input', () => {
    const q = filter.value.trim().toLowerCase();
    boxes.forEach((b, i) => { rows[i].hidden = !!q && !b.m.username.toLowerCase().includes(q); });
  });
  openDialog({
    title: `People in ${g.path}`,
    submitLabel: 'Save',
    body: [
      el('p', null, g.private ? 'This group is private: only the people ticked here see it and its skills.' : 'This group is open: the whole team sees it. People ticked here are its members.'),
      filter,
      el('fieldset', { class: 'picker' }, el('legend', { class: 'sr-only' }, `Members of ${team.name}`), el('div', { class: 'picker-list' }, rows)),
    ],
    onSubmit: async () => {
      const changed = boxes.filter(b => b.box.checked !== b.was);
      for (const b of changed) {
        await api(`/api/teams/${enc(team.name)}/group/members`, { path: g.path, username: b.m.username, member: b.box.checked });
      }
      return changed.length ? `Updated who is in ${g.path}.` : null;
    },
  });
}

function inviteCodeDialog(team, code) {
  const input = el('input', { class: 'input', type: 'text', readOnly: true, value: code, 'aria-label': 'Invite code', on: { focus: () => input.select() } });

  openDialog({
    title: `Invite code for ${team.name}`,

      el('div', { class: 'field' }, el('div', { class: 'code-box' }, input, copy), copied),

}

function joinDialog() {
  const code = el('input', { class: 'input mono', type: 'text', autocomplete: 'off', spellcheck: false, placeholder: 'aistinv_…' });
  openDialog({
    title: 'Join a team',
    submitLabel: 'Join team',
    body: [field('Invite code', code, 'Ask an admin of the team for its invite code.')],

async function signOut(control) {
  control.setAttribute('aria-disabled', 'true');
  try { await api('/api/logout', {}); }
  catch (e) {
    if (!(e instanceof SessionEnded)) { control.removeAttribute('aria-disabled'); return toast(e.message, 'error'); }
  }
  sessionEnded(true);
}

function fullPage(...kids) {
  document.querySelectorAll('dialog[open]').forEach(d => d.close());
  $app.replaceWith(el('main', { class: 'fullpage' }, el('div', { class: 'box', role: 'alert' }, kids)));
  $toasts.replaceChildren();
}
function sessionEnded() {
  state = null;
  document.title = 'Session ended · AIStack';
  fullPage(
    el('span', { class: 'logo', style: 'width:40px;height:40px;border-radius:8px' }, icon('layers', 22)),
    el('h1', null, 'Your session has ended.'),
    el('p', null, 'Ask your coding agent to "open my aistack dashboard" for a new link.'),
    DEMO && btn('Restart the demo', { on: { click: () => location.reload() } }));
}

function setDrawer(open) {
  $app.classList.toggle('drawer-open', open);
  $drawerBtn.setAttribute('aria-expanded', String(open));
  $drawerBtn.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  if (open) {
    void $sidebar.offsetWidth; // apply visibility before focusing into the drawer
    const first = $sidebar.querySelector('a, button');
    if (first) first.focus();
  }
}
$drawerBtn.addEventListener('click', () => setDrawer(!$app.classList.contains('drawer-open')));
document.getElementById('scrim').addEventListener('click', () => setDrawer(false));
$sidebar.addEventListener('click', ev => { if (ev.target.closest('a, .nav-btn')) setDrawer(false); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $app.classList.contains('drawer-open')) { setDrawer(false); $drawerBtn.focus(); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

// "/" jumps to the search box, unless the user is already typing somewhere.
document.addEventListener('keydown', ev => {
  if (ev.key !== '/' || ev.metaKey || ev.ctrlKey || ev.altKey || document.querySelector('dialog[open]')) return;
  if (ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]')) return;
  const box = document.getElementById('search');
  if (box) { ev.preventDefault(); box.focus(); box.select(); }
});

          { name: 'incident-notes', description: 'Turns a chat log into a blameless incident summary with a timeline.', group: null, revision: 3, pushed_by: 'eve', updated_on: ago(70), in_my_skills: false },
        ] },
      { name: 'acme', kind: 'SHARED', role: 'ADMIN', sees_all_groups: false,
        members: [person('dimitris', 'ADMIN', ['backend', 'backend/aistack']), person('maria', 'MEMBER', ['backend', 'backend/aistack']), person('eve', 'MEMBER', ['security'])],
        groups: [
          { path: 'backend', private: false, member: true, subscribed: true },
          { path: 'backend/aistack', private: true, member: true, subscribed: true },
          { path: 'security', private: true, member: false, subscribed: true },
        ],
        skills: [
          { name: 'commit-messages', description: 'Writes commit messages in the house style: imperative subject, why before what.', group: null, revision: 2, pushed_by: 'dimitris', updated_on: ago(96), in_my_skills: true },
          { name: 'release-notes', description: 'Builds release notes from merged pull requests since the last tag.', group: null, revision: 1, pushed_by: 'dimitris', updated_on: ago(300), in_my_skills: false },
          { name: 'code-review', description: 'Reviews a diff against team standards and flags risky changes.', group: 'backend', revision: 3, pushed_by: 'maria', updated_on: ago(3), in_my_skills: true },
          { name: 'api-design', description: 'Checks a new endpoint against the API guidelines before it ships.', group: 'backend', revision: 5, pushed_by: 'eve', updated_on: ago(120), in_my_skills: false },
          { name: 'sqlalchemy-migrations', description: 'Plans and writes Alembic migrations that run identically on SQLite and Postgres.', group: 'backend/aistack', revision: 4, pushed_by: 'maria', updated_on: ago(52), in_my_skills: true },
          { name: 'mcp-tool-authoring', description: 'Scaffolds a thin MCP tool with its service function and rejection tests.', group: 'backend/aistack', revision: 2, pushed_by: 'dimitris', updated_on: ago(26), in_my_skills: false },
          { name: 'threat-model', description: 'Walks a design through trust boundaries and lists what an attacker controls.', group: 'security', revision: 1, pushed_by: 'eve', updated_on: ago(240), in_my_skills: false },
          { name: 'dependency-audit', description: 'Audits new dependencies for licence, maintenance and known advisories.', group: 'security', revision: 3, pushed_by: 'eve', updated_on: ago(18), in_my_skills: false },
        ] },
    ],
  };
})();

function fail(message) { throw new Error(message); }
const dNow = () => new Date().toISOString();
const dMe = () => DB.user.username;
const dTeam = name => DB.teams.find(t => t.name === name) || fail(`There is no team called ${name}.`);
const dMine = name => DB.skills.find(s => s.name === name) || fail(`${name} is not in My skills.`);
const dTeamSkill = (t, name) => t.skills.find(s => s.name === name) || fail(`${t.name} has no skill called ${name}.`);
const dMember = (t, username) => t.members.find(m => m.username === username) || fail(`${username} is not in ${t.name}.`);
const dGroup = (t, path) => t.groups.find(g => g.path === path) || fail(`${t.name} has no group ${path}.`);
const dAdmin = t => { if (t.role !== 'ADMIN') fail(`Only an admin of ${t.name} can do that.`); };
const dShared = t => { if (t.kind === 'SERVER') fail(`Everyone on this server is in ${t.name}; nobody can leave it or be removed from it.`); };

const DEMO_ROUTES = [
  [/^\/api\/skills\/([^/]+)\/machines\/([^/]+)$/, (b, name, id) => {
    const s = dMine(name);
    s.machines = s.machines.filter(m => m !== id);
    if (b.enabled) s.machines.push(id);
  }],
  [/^\/api\/skills\/([^/]+)\/share$/, (b, name) => {
    const s = dMine(name), t = dTeam(b.team), group = b.group || null;
    const had = t.skills.find(x => x.name === name);
    const fromHere = !!s.source && s.source.team === t.name;
    if (had && fromHere && s.source.revision === had.revision && (had.group || null) === group) {
      return { team: t.name, group, revision: had.revision, created: false, unchanged: true, previous_pushed_by: had.pushed_by, possibly_unrelated: false };
    }
    const revision = had ? had.revision + 1 : 1, previous = had ? had.pushed_by : null;
    const copy = { name, description: s.description, group, revision, pushed_by: dMe(), updated_on: dNow(), in_my_skills: true };
    if (had) Object.assign(had, copy); else t.skills.push(copy);
    s.source = { team: t.name, group, revision, latest_revision: revision, latest_pushed_by: dMe(), update_available: false };
    return { team: t.name, group, revision, created: !had, unchanged: false, previous_pushed_by: previous, possibly_unrelated: !!had && !fromHere };
  }],
  [/^\/api\/skills\/([^/]+)\/remove$/, (b, name) => {
    dMine(name);
    DB.skills = DB.skills.filter(s => s.name !== name);
    DB.teams.forEach(t => t.skills.forEach(s => { if (s.name === name) s.in_my_skills = false; }));
  }],
  [/^\/api\/teams$/, b => {
    if (!NAME_RE.test(b.name)) fail(`"${b.name}" is not a valid team name. ${NAME_RULE}`);
    if (DB.teams.some(t => t.name === b.name)) fail(`A team called ${b.name} already exists. Pick another name.`);
    DB.teams.push({ name: b.name, kind: 'SHARED', role: 'ADMIN', sees_all_groups: false, members: [{ username: dMe(), role: 'ADMIN', sees_all_groups: false, groups: [] }], groups: [], skills: [] });
  }],
  [/^\/api\/teams\/join$/, b => {
    if (!/^aistinv_.+/.test(b.code)) fail('That invite code is not valid. Ask an admin of the team for a new one. (In the demo, any code starting with aistinv_ works.)');
    if (DB.teams.some(t => t.name === 'design')) fail('You are already in design.');
    DB.teams.push({ name: 'design', kind: 'SHARED', role: 'MEMBER', sees_all_groups: false,
      members: [{ username: 'eve', role: 'ADMIN', sees_all_groups: false, groups: ['tokens'] }, { username: dMe(), role: 'MEMBER', sees_all_groups: false, groups: [] }],
      groups: [{ path: 'tokens', private: false, member: false, subscribed: true }],
      skills: [{ name: 'design-tokens', description: 'Keeps colours, spacing and type in sync with the token file.', group: 'tokens', revision: 2, pushed_by: 'eve', updated_on: dNow(), in_my_skills: false }] });
    return { team: 'design' };
  }],
  [/^\/api\/teams\/([^/]+)\/leave$/, (b, team) => {
    const t = dTeam(team); dShared(t);
    if (t.role === 'ADMIN' && t.members.filter(m => m.role === 'ADMIN').length === 1 && t.members.length > 1) fail(`You are the only admin of ${t.name}. Make someone else an admin before you leave.`);
    DB.teams = DB.teams.filter(x => x !== t);
    DB.skills.forEach(s => { if (s.source && s.source.team === team) s.source = null; });
  }],
  [/^\/api\/teams\/([^/]+)\/invite$/, (b, team) => {
    const t = dTeam(team); dAdmin(t); dShared(t);
    const bytes = crypto.getRandomValues(new Uint8Array(18));
    return { code: 'aistinv_' + Array.from(bytes, x => x.toString(36).padStart(2, '0')).join('').slice(0, 32) };
  }],
  [/^\/api\/teams\/([^/]+)\/take$/, (b, team) => {
    const t = dTeam(team), ts = dTeamSkill(t, b.name);
    const source = { team: t.name, group: ts.group, revision: ts.revision, latest_revision: ts.revision, latest_pushed_by: ts.pushed_by, update_available: false };
    const mine = DB.skills.find(s => s.name === b.name);
    if (mine) Object.assign(mine, { description: ts.description, revision: mine.revision + 1, pushed_by: ts.pushed_by, updated_on: dNow(), source });
    else DB.skills.push({ name: ts.name, description: ts.description, revision: 1, pushed_by: ts.pushed_by, updated_on: dNow(), files: 3, machines: DB.machines.map(m => m.id), source });
    DB.skills.sort((a, c) => a.name.localeCompare(c.name));
    ts.in_my_skills = true;
  }],
  [/^\/api\/teams\/([^/]+)\/members\/([^/]+)$/, (b, team, username) => {
    const t = dTeam(team); dAdmin(t);
    const m = dMember(t, username);
    if (b.role && b.role !== m.role) {
      if (b.role === 'MEMBER' && t.members.filter(x => x.role === 'ADMIN').length === 1) fail(`${username} is the only admin of ${t.name}. Make someone else an admin first.`);
      m.role = b.role;
      if (username === dMe()) t.role = b.role;
    }
    if (typeof b.sees_all_groups === 'boolean') {
      m.sees_all_groups = b.sees_all_groups;
      if (username === dMe()) t.sees_all_groups = b.sees_all_groups;
    }
  }],
  [/^\/api\/teams\/([^/]+)\/members\/([^/]+)\/remove$/, (b, team, username) => {
    const t = dTeam(team); dAdmin(t); dShared(t);
    dMember(t, username);
    t.members = t.members.filter(m => m.username !== username);
  }],
  [/^\/api\/teams\/([^/]+)\/groups$/, (b, team) => {
    const t = dTeam(team); dAdmin(t);
    if (!NAME_RE.test(b.name)) fail(`"${b.name}" is not a valid group name. ${NAME_RULE}`);
    if (b.parent) dGroup(t, b.parent);
    const path = b.parent ? `${b.parent}/${b.name}` : b.name;
    if (t.groups.some(g => g.path === path)) fail(`${t.name} already has a group ${path}.`);
    t.groups.push({ path, private: !!b.private, member: true, subscribed: true });
    dMember(t, dMe()).groups.push(path);
    return { path };
  }],
  [/^\/api\/teams\/([^/]+)\/group$/, (b, team) => {
    const t = dTeam(team), g = dGroup(t, b.path);
    if (typeof b.private === 'boolean') { dAdmin(t); g.private = b.private; }
    if (typeof b.subscribed === 'boolean') g.subscribed = b.subscribed;
  }],
  [/^\/api\/teams\/([^/]+)\/group\/members$/, (b, team) => {
    const t = dTeam(team); dAdmin(t);
    const g = dGroup(t, b.path), m = dMember(t, b.username);
    m.groups = m.groups.filter(p => p !== b.path);
    if (b.member) m.groups.push(b.path);
    m.groups.sort();
    if (b.username === dMe()) g.member = !!b.member;
  }],
  [/^\/api\/teams\/([^/]+)\/skills\/([^/]+)\/move$/, (b, team, name) => {
    const t = dTeam(team); dAdmin(t);
    const s = dTeamSkill(t, name);
    if (b.group) dGroup(t, b.group);
    s.group = b.group || null;
    DB.skills.forEach(x => { if (x.name === name && x.source && x.source.team === team) x.source.group = s.group; });
  }],
  [/^\/api\/teams\/([^/]+)\/skills\/([^/]+)\/remove$/, (b, team, name) => {
    const t = dTeam(team); dAdmin(t);
    dTeamSkill(t, name);
    t.skills = t.skills.filter(s => s.name !== name);
    DB.skills.forEach(x => { if (x.name === name && x.source && x.source.team === team) x.source = null; });
  }],
  [/^\/api\/logout$/, () => {}],
];

async function demoApi(path, body) {
  await new Promise(r => setTimeout(r, 220));
  if (path === '/api/state') return JSON.parse(JSON.stringify(DB));
  for (const [re, handler] of DEMO_ROUTES) {
    const m = re.exec(path);
    if (m) return handler(body || {}, ...m.slice(1).map(decodeURIComponent)) || {};
  }
  fail(`The demo does not know ${path}.`);
}

/* ================= start ================= */

function start() {
  load().catch(e => {
    if (e instanceof SessionEnded) return sessionEnded();
    $main.replaceChildren(el('div', { class: 'wrap body' }, empty('info', 'The dashboard could not load', el('p', null, e.message),
      btn('Try again', { class: 'btn primary', on: { click: ev => { ev.currentTarget.setAttribute('aria-disabled', 'true'); start(); } } }))));
  });
}
start();
})();
</script>
